<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人极客导航 | 2026 Edition</title>
    <!-- PWA 支持 -->
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            background-image: radial-gradient(circle at top right, #1e293b 0%, transparent 40%),
                              radial-gradient(circle at bottom left, #0c4a6e 0%, transparent 40%);
        }

        .container { max-width: 1000px; width: 100%; }

        /* 头部与 GitHub 链接 */
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 2rem; 
            flex-wrap: wrap; 
            gap: 1rem; 
            width: 100%;
        }
        h1 { 
            font-size: 1.8rem; 
            background: linear-gradient(to right, #38bdf8, #818cf8); 
            -webkit-background-clip: text; 
            color: transparent; 
        }
        .github-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }
        .github-link:hover { opacity: 0.8; }

        /* 搜索框样式 */
        .search-box { display: flex; gap: 10px; margin-bottom: 2rem; flex-wrap: wrap; }
        .search-box select, .search-box input { padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-main); outline: none; }
        .search-box select { width: 140px; }
        .search-box input { flex: 1; }

        /* 网格布局 */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
            backdrop-filter: blur(12px);
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); border-color: var(--accent); }
        
        .card-title { font-size: 1.1rem; margin-bottom: 1rem; color: var(--accent); font-weight: 600; display: flex; align-items: center; gap: 8px; }
        
        .link-list { list-style: none; }
        .link-list li { margin-bottom: 0.8rem; }
        .link-list a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; display: block; }
        .link-list a:hover { color: var(--text-main); padding-left: 4px; }

        /* M3U8 播放器卡片样式 */
        .player-card { text-align: center; }
        .player-btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            background: var(--accent);
            color: #0f172a;
            border-radius: 10px;
            font-weight: bold;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .player-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🚀 2026 极客导航</h1>
        <a href="https://github.com/BlueDriftHK" target="_blank" class="github-link">GitHub 主页</a>
    </header>

    <div class="search-box">
        <select id="search-engine">
            <option value="google">Google</option>
            <option value="github">GitHub</option>
        </select>
        <input type="text" placeholder="快速搜索..." id="search-input">
    </div>

    <div class="grid">
        
        <!-- M3U8 播放器卡片 -->
        <!-- 动态链接已根据 2026-05-19 和 广东省江门市 生成 -->
        <a href="https://bluedrifthk.github.io/CF-Wroker-M3U8Player/2026-05-19_广东省_江门市" target="_blank" class="card player-card">
            <div class="card-title">🎬 M3U8 播放器</div>
            <p>基于 Cloudflare Workers 的流媒体终端</p>
            <div class="player-btn">立即播放</div>
        </a>

        <!-- 其他卡片占位符 -->
        <div class="card">
            <div class="card-title">🌤️ 天气实况</div>
            <p>江门气象 · 2026</p>
            <div id="weather-data">加载中...</div>
        </div>

        <div class="card">
            <div class="card-title">📅 2026 时间胶囊</div>
            <div id="countdown">计算中...</div>
        </div>

    </div>
</div>

<script>
    // 这里可以放置搜索功能或其他逻辑
    console.log("导航页已加载");
</script>

</body>
</html>
