<script>window.__SITE__ = {"site":{"brand_zh":"蓝漂 · BlueDrift","brand_en":"BlueDrift","tagline_zh":"在 Cloudflare 边缘，把想法做成单文件产品","tagline_en":"Single-file products, built at the Cloudflare edge","lead_zh":"两个 AGPL-3.0 开源项目，一份工程日志。产品都是单个 Worker 文件：零运行时依赖、无构建步骤、粘贴即部署，按 Cloudflare 免费额度设计。","lead_en":"Two AGPL-3.0 open-source projects and one engineering log. Each product is a single Worker file: zero runtime dependencies, no build step, paste-and-deploy, designed to run inside Cloudflare's free tier.","url":"https://blog.bjhr.online","repo":"https://github.com/BlueDriftHK/BlueDriftHK","author":"BlueDriftHK","github":"https://github.com/BlueDriftHK"},"about":{"skills_zh":["JavaScript / TypeScript","Cloudflare Workers · R2 · KV · Durable Objects","原生 Web（无框架单文件 SPA）","WebDAV / HTTP / TLS 协议","Rust → Wasm（在学）"],"skills_en":["JavaScript / TypeScript","Cloudflare Workers · R2 · KV · Durable Objects","Vanilla web (framework-free single-file SPA)","WebDAV / HTTP / TLS","Rust → Wasm (learning)"],"timeline":[{"date":"2026-04","zh":"NetSight Pro 首个公开版本上线，开始按「默认零 Worker 出站」重构","en":"First public NetSight Pro release; refactored around zero Worker egress by default"},{"date":"2026-09","zh":"PersonalDrive 仓库建立，确定 R2 + KV + 可选 DO 的三段式架构","en":"PersonalDrive repo created; settled on R2 + KV + optional DO"},{"date":"2026-10","zh":"PersonalDrive v5.2.0 与 NetSight Pro v4.7.1 发布；博客站重做","en":"PersonalDrive v5.2.0 and NetSight Pro v4.7.1 shipped; blog rebuilt"}]},"tags":[{"name":"安全","count":2,"slug":"security"},{"name":"代码审查","count":1,"slug":"code-review"},{"name":"fail-closed","count":1,"slug":"fail-closed"},{"name":"Cloudflare Workers","count":1,"slug":"cloudflare-workers"},{"name":"R2","count":1,"slug":"r2"},{"name":"KV","count":1,"slug":"kv"},{"name":"WebDAV","count":1,"slug":"webdav"},{"name":"Workers","count":1,"slug":"workers"},{"name":"网络诊断","count":1,"slug":"diagnostics"},{"name":"单文件","count":2,"slug":"single-file"},{"name":"SSRF","count":1,"slug":"ssrf"},{"name":"Worker","count":1,"slug":"worker"},{"name":"工程","count":1,"slug":"engineering"},{"name":"实践","count":1,"slug":"practice"}],"cats":[{"name":"安全","count":2,"slug":"security"},{"name":"项目","count":1,"slug":"project"},{"name":"架构","count":1,"slug":"architecture"},{"name":"工程","count":1,"slug":"engineering"}],"products":[{"id":"personal-drive","name":"PersonalDrive","repo":"CF-KVR2-NetworkCloud","subtitle_zh":"自托管网盘 · 单个 Worker 文件","subtitle_en":"Self-hosted cloud drive · one Worker file","github":"https://github.com/BlueDriftHK/CF-KVR2-NetworkCloud","intro_url":"https://icloud.bjhr.online/","intro_label_zh":"项目介绍页","intro_label_en":"Project intro page","version":"v5.2.0","lines":13279,"uiBuild":"flat-1","license":"AGPL-3.0","accent":["#0a84ff","#5f5cf1"],"icon":"drive","summary_zh":"把一整个网盘装进一个 Worker：文件存 R2、元数据存 KV（唯一真相源）、目录索引可选走 Durable Object 加速（不绑自动回退 KV，功能一致）。界面与交互全部内嵌在这一个文件里，无构建、无运行时依赖。","summary_en":"An entire cloud drive inside one Worker: files in R2, metadata in KV (single source of truth), optional Durable Object to accelerate the directory index (KV fallback when unbound — same features). UI and interactions are inlined in the same file. No build, no runtime dependencies.","stats":[{"k_zh":"单文件行数","k_en":"Lines (single file)","v":"13,279"},{"k_zh":"文件体积","k_en":"File size","v":"795 KB"},{"k_zh":"运行时依赖","k_en":"Runtime deps","v":"0"},{"k_zh":"必需绑定","k_en":"Required bindings","v":"R2 + KV"}],"features":[{"icon":"lock","title_zh":"认证与会话","title_en":"Auth & sessions","body_zh":"口令加盐哈希 + 常量时间比较；会话 7 天、可逐台注销、改密即全体失效；可选 TOTP（SHA-1 / 6 位 / 30 秒）+ 8 个仅存哈希的备用码；KV 不可用时切换 HMAC 无状态会话。","body_en":"Salted password hashing with constant-time comparison; 7-day sessions, per-device revocation, rotate-on-password-change; optional TOTP with 8 hash-only backup codes; HMAC stateless session fallback when KV is unavailable."},{"icon":"folder-lock","title_zh":"目录密码锁","title_en":"Per-directory locks","body_zh":"任意目录（含根目录整体上锁）可设独立密码；锁定子树在列表、搜索、查询、复制、移动、删除、打包与分享链路中一并过滤。","body_en":"Lock any directory — including the root — with its own password. Locked subtrees are filtered in listing, search, query, copy, move, delete, zip and share paths."},{"icon":"upload","title_zh":"上传链路","title_en":"Upload pipeline","body_zh":"队列并发 1–6；超过 5 MB 自动切片（5 MB/片）并装配校验；失败任务写入 localStorage 支持刷新后续传；按内容哈希秒传。","body_en":"Queue with 1–6 concurrent uploads; files over 5 MB are chunked (5 MB each) and verified on assembly; interrupted jobs resume after refresh; instant upload by content hash."},{"icon":"share","title_zh":"分享与收件箱","title_en":"Sharing & inbox","body_zh":"分享可叠加密码、有效期、访问次数上限、一次性下载、禁止下载仅预览、IP·CIDR / 国家 / UA 限制与自定义短链；另有 /u/ 限时上传链接与带 Turnstile 的公开上传页。","body_en":"Share links can stack password, expiry, hit limit, one-time download, download-disabled preview-only, IP/CIDR/country/UA rules and custom short links; plus /u/ time-limited upload links and a Turnstile-guarded public upload page."},{"icon":"plug","title_zh":"WebDAV 与集成","title_en":"WebDAV & integration","body_zh":"内置 /dav/ 端点，可挂载为 Windows / macOS / Linux 网络驱动器；只读令牌供脚本调用，写操作统一 403；另有 S3 兼容后端并联与远程 WebDAV 导入。","body_en":"Built-in /dav/ endpoint mountable on Windows / macOS / Linux; read-only tokens for scripts (writes return 403); optional S3-compatible mirror backend and remote WebDAV import."},{"icon":"history","title_zh":"版本 · 回收站 · 备份","title_en":"Versions · trash · backup","body_zh":"覆盖写入保留 ≤5 个历史版本（单份 ≤64 MB）；删除进回收站保留 30 天；增量备份快照最多 14 份、总占用 ≤200 MB，恢复前可看差异。","body_en":"Up to 5 versions per file (≤64 MB each); 30-day trash with restore; incremental snapshots capped at 14 sets and 200 MB total, with a diff preview before restore."},{"icon":"shield","title_zh":"出站与风控","title_en":"Egress & abuse controls","body_zh":"远程抓取仅允许 http/https，主机黑名单 + DNS 解析后校验 + 逐跳重定向检查，默认单文件 ≤200 MB、10 秒超时；读写限流 150/30 每分钟，登录 5 次/5 分钟双维度限频。","body_en":"URL fetching allows only http/https with host blacklist, post-DNS validation and per-hop redirect checks (200 MB default cap, 10s timeout); rate limits of 150 reads / 30 writes per minute and 5 login attempts per 5 minutes."},{"icon":"sparkles","title_zh":"体验","title_en":"Experience","body_zh":"四视图（网格 / 列表 / 列 / 图库）与虚拟滚动、⌘K 命令面板、标签与收藏分组、音乐播放器（ID3 + LRC）、Office / PDF / Markdown 预览、PWA 分享即上传、中英双语。","body_en":"Four views with virtual scrolling, ⌘K command palette, tags and favourite groups, music player (ID3 + LRC), Office / PDF / Markdown preview, PWA share-to-upload, bilingual UI."}],"requirements":{"bindings":[{"name":"DRIVE","type":"R2","required":true,"note_zh":"文件本体与内部对象（.versions/ .trash/ .chunks/ .thumb/ .backup/）","note_en":"File bodies and internal objects"},{"name":"STORE","type":"KV","required":true,"note_zh":"目录元数据、会话、配置、索引——元数据的唯一真相源","note_en":"Directory metadata, sessions, config, indexes — the single source of truth"},{"name":"DIR","type":"Durable Object","required":false,"note_zh":"目录索引加速，类名 DirStore；不绑自动回退 KV，功能一致","note_en":"Directory index acceleration (class DirStore); KV fallback when unbound"}],"env":[{"name":"DRIVE_PASSWORD","required":true,"note_zh":"管理员口令，建议 16 位以上随机串","note_en":"Admin password, 16+ random characters"},{"name":"URL_SIGN_SECRET","required":false,"note_zh":"签名直链与无状态会话密钥；与口令解耦，便于单独轮换","note_en":"Key for signed links and stateless sessions; decoupled from the password"},{"name":"DRIVE_TITLE / DRIVE_QUOTA","required":false,"note_zh":"站点标题（默认「云端网盘」）/ 总配额（默认 10 GB）","note_en":"Site title / total quota (10 GB default)"},{"name":"TURNSTILE_SITE_KEY + TURNSTILE_SECRET","required":false,"note_zh":"公开上传页人机验证，两项同时配置才生效","note_en":"Turnstile for the public upload page; both keys required"},{"name":"IP_ALLOW / IP_DENY","required":false,"note_zh":"IP 黑白名单，支持 CIDR","note_en":"IP allow/deny lists with CIDR support"}]},"limits":[{"k_zh":"单文件上传","k_en":"Max upload size","v_zh":"500 MB（可配）","v_en":"500 MB (configurable)"},{"k_zh":"分片","k_en":"Chunking","v_zh":"5 MB / 片，≤10000 片","v_en":"5 MB per chunk, ≤10,000 chunks"},{"k_zh":"路径 / KV 单值","k_en":"Path / KV value","v_zh":"400 字符 / 8 MB","v_en":"400 chars / 8 MB"},{"k_zh":"单目录条目","k_en":"Entries per directory","v_zh":"20,000（超限 507）","v_en":"20,000 (507 above)"},{"k_zh":"版本 / 回收站","k_en":"Versions / trash","v_zh":"≤5 份（单份 ≤64 MB）/ 30 天","v_en":"≤5 (≤64 MB each) / 30 days"},{"k_zh":"备份","k_en":"Backups","v_zh":"14 份，总量 ≤200 MB","v_en":"14 sets, ≤200 MB total"},{"k_zh":"KV 写预算","k_en":"KV write budget","v_zh":"600 次/分钟","v_en":"600 / minute"},{"k_zh":"每日遥测写入","k_en":"Daily telemetry writes","v_zh":"500 条（免费额度的一半）","v_en":"500 (half the free allowance)"},{"k_zh":"接口限流","k_en":"API rate limits","v_zh":"读 150 / 写 30 每分钟","v_en":"150 reads / 30 writes per minute"},{"k_zh":"打包下载","k_en":"Zip download","v_zh":"站内 2000 文件・2 GB；分享 500 文件・512 MB","v_en":"2,000 files · 2 GB in-app; 500 files · 512 MB for shares"}],"boundaries_zh":["单管理员模型，不做多租户隔离。","WebDAV 的目录 MOVE/COPY 返回 501（请用站内移动 / 复制），Depth: infinity 按 1 处理。","备份快照只含元数据——不含文件本体，也不含 TOTP 密钥；恢复不可撤销。","主应用页未启用严格 CSP / SRI；口令哈希为单轮加盐 SHA-256，抗离线暴力弱于 PBKDF2 / Argon2。","R2 中文件为明文（非端到端加密），仅提供单文件客户端加密上传。","元数据全在 KV，而免费额度是每天 1,000 次写（针对不同键）——适合个人低频使用，不适合高频写入场景。"],"boundaries_en":["Single-admin model; no multi-tenant isolation.","WebDAV directory MOVE/COPY returns 501 (use the in-app move/copy); Depth: infinity is treated as 1.","Backup snapshots are metadata-only — no file bodies, no TOTP secret — and restores are irreversible.","The main app page ships without a strict CSP/SRI; password hashing is single-round salted SHA-256, weaker against offline cracking than PBKDF2/Argon2.","Files are plaintext in R2 (not end-to-end encrypted); only per-file client-side encryption is offered.","All metadata lives in KV, and the free tier allows 1,000 writes/day to distinct keys — fine for personal low-frequency use, not for write-heavy workloads."],"quickstart":{"lang":"toml","code":"name = \"personal-drive\"\nmain = \"_workers.js\"\ncompatibility_date = \"2025-01-01\"\n\n[[r2_buckets]]\nbinding = \"DRIVE\"\nbucket_name = \"your-bucket\"\n\n[[kv_namespaces]]\nbinding = \"STORE\"\nid = \"\u003c你的 KV namespace id>\"\n\n[[durable_objects.bindings]]   # 可选：目录索引加速\nname = \"DIR\"\nclass_name = \"DirStore\"\n\n[[migrations]]\ntag = \"v1\"\nnew_sqlite_classes = [\"DirStore\"]\n\n[triggers]\ncrons = [\"17 3 * * *\"]          # 可选：回收站 / 分片 / 备份"},"selfcheck_zh":"访问 /api/version 应返回 version、ui 与 bindings（store / drive 必须为 true）；页面底部状态条应显示 v5.2.0 · flat-1。","selfcheck_en":"GET /api/version must return version, ui and bindings (store/drive true); the footer status strip should read v5.2.0 · flat-1.","tags_zh":["Cloudflare Workers","R2 · KV · DO","WebDAV","TOTP"],"tags_en":["Cloudflare Workers","R2 · KV · DO","WebDAV","TOTP"]},{"id":"netsight-pro","name":"NetSight Pro","repo":"CF-workers-netdiag","subtitle_zh":"边缘网络诊断 · 单个 Worker 文件","subtitle_en":"Edge network diagnostics · one Worker file","github":"https://github.com/BlueDriftHK/CF-workers-netdiag","intro_url":"https://ipcheck.bjhr.online/","intro_label_zh":"项目介绍页","intro_label_en":"Project intro page","version":"v4.7.1","lines":7464,"uiBuild":"","license":"AGPL-3.0","accent":["#5856d6","#af52de"],"icon":"pulse","summary_zh":"23 项诊断工具分 6 组，单文件零依赖。多数测量在浏览器侧完成，默认不做 Worker 出站；不需要任何必需绑定，KV 历史为可选。界面三语（简 / 繁 / EN），带 nonce CSP 与 SSRF 防护。","summary_en":"23 diagnostic tools in 6 groups, one dependency-free file. Most measurements happen in the browser with zero Worker egress by default; no required bindings — KV history is optional. Trilingual UI with nonce CSP and SSRF defences.","stats":[{"k_zh":"诊断工具","k_en":"Diagnostic tools","v":"23 · 6 组"},{"k_zh":"单文件行数","k_en":"Lines (single file)","v":"7,464"},{"k_zh":"必需绑定","k_en":"Required bindings","v":"无"},{"k_zh":"界面语言","k_en":"UI languages","v":"简 / 繁 / EN"}],"features":[{"icon":"pulse","title_zh":"网络质量与延迟（7）","title_en":"Quality & latency (7)","body_zh":"一键体检（串跑 6 步）、长时质量监控、丢包率、TTFB 分阶段分析、WebSocket 往返延迟、代理/VPN 检测、WebRTC 泄漏。","body_en":"One-click health check (6 sequential steps), long-run quality monitor, packet loss, staged TTFB, WebSocket round-trip, proxy/VPN detection, WebRTC leaks."},{"icon":"gauge","title_zh":"带宽与吞吐（6）","title_en":"Bandwidth & throughput (6)","body_zh":"多档位上下行测速、多流并发（≤16 路，内部并发 4）、上传测速、缓冲膨胀、分块流式吞吐、并发连接测试。","body_en":"Multi-tier up/down speed tests, concurrent streams (≤16, internal concurrency 4), upload test, bufferbloat, chunked streaming throughput, connection concurrency."},{"icon":"globe","title_zh":"DNS（3）","title_en":"DNS (3)","body_zh":"DNS 解析、DNS 工具箱、多解析器对比；查询经 DoH 发出，域名长度与类型均有白名单校验（A/AAAA/CNAME/MX/TXT/NS/SOA/CAA）。","body_en":"Resolver lookup, DNS toolbox, multi-resolver comparison; queries go over DoH with name-length and query-type allowlists."},{"icon":"shield","title_zh":"安全与合规（2）","title_en":"Security & compliance (2)","body_zh":"站点体检审计任意站点的 HSTS / CSP / X-Frame-Options 等响应头与首字节，可勾选证书到期检查（走 CT 日志）；域名安全体检覆盖 DKIM 等记录。","body_en":"Site audit checks HSTS/CSP/X-Frame-Options and TTFB of any site, with optional certificate expiry via CT logs; domain audit covers DKIM and more."},{"icon":"route","title_zh":"可达性与多节点（3）","title_en":"Reachability & multi-node (3)","body_zh":"流媒体连通性、网络可达性、多节点对比——在浏览器侧对多个目标并发探测并对比结果。","body_en":"Streaming reachability, network reachability and multi-node comparison — probed concurrently from the browser and compared."},{"icon":"activity","title_zh":"监控与系统（2）","title_en":"Monitoring & system (2)","body_zh":"站点监控支持可选 Cron 巡检（*/5）与状态变化告警，配合管理密钥；另有 CPU 性能基准。","body_en":"Site monitoring with optional Cron sweeps (*/5) and change alerts behind an admin key; plus a CPU benchmark."}],"requirements":{"bindings":[{"name":"SPEED_HISTORY","type":"KV","required":false,"note_zh":"测速历史与站点监控状态；默认关闭，未绑定即退化为内存统计","note_en":"Speed history and monitor state; off by default, falls back to in-memory stats"},{"name":"CACHE_KV","type":"KV","required":false,"note_zh":"静态资源缓存（/static/ 前缀当前已停用，绑定无影响）","note_en":"Static asset cache (/static/ is currently disabled; binding has no effect)"},{"name":"MONITOR_ADMIN_KEY","type":"Secret","required":false,"note_zh":"站点监控管理密钥，仅通过 x-admin-key 请求头传入","note_en":"Admin key for site monitoring, accepted only via the x-admin-key header"},{"name":"ALLOWED_ORIGINS","type":"Var / Secret","required":false,"note_zh":"跨域白名单，默认仅同源","note_en":"CORS allowlist; same-origin only by default"}],"env":[{"name":"crons","required":false,"note_zh":"可选 [triggers] crons = [\"*/5 * * * *\"]，驱动监控巡检","note_en":"Optional [triggers] crons = [\"*/5 * * * *\"] to drive monitor sweeps"}]},"limits":[{"k_zh":"上传 / 测速单次","k_en":"Upload / single speed test","v_zh":"≤32 MB / ≤64 MiB","v_en":"≤32 MB / ≤64 MiB"},{"k_zh":"KV 写入闸门","k_en":"KV write gate","v_zh":"20 次/分、600 次/日（每 isolate）","v_en":"20/min, 600/day per isolate"},{"k_zh":"接口限流","k_en":"Rate limits","v_zh":"60 次/分/IP；/health 180；大响应下载 30；/cpu-test 3","v_en":"60/min/IP; /health 180; large downloads 30; /cpu-test 3"},{"k_zh":"出站超时","k_en":"Egress timeouts","v_zh":"DoH 5s、站点体检 8s、监控 10s","v_en":"DoH 5s, site audit 8s, monitor 10s"},{"k_zh":"SSRF 防护","k_en":"SSRF defence","v_zh":"仅 http/https、端口 80/443、私网与保留段拦截、DNS 解析后校验、逐跳复检（≤6 跳）","v_en":"http/https only, ports 80/443, private/reserved range blocking, post-DNS validation, per-hop re-checks (≤6)"}],"boundaries_zh":["JA3 / JA4 指纹由 Cloudflare 平台提供，仅 Enterprise + Bot Management 可用；其他环境该字段显示 N/A。","做不了 traceroute / 跳数路径与真实 MTU 探测——Workers 与浏览器都不提供 ICMP / TTL 与分片控制。","直读证书链不可行（fetch 不暴露对端证书），证书到期改走 CT 日志。","以下端点已停用，统一返回 410：/dns-proxy、/api/ip-fraud、/api/reach-check、/static/*。","令牌与限流状态是 per-isolate 的（不跨 isolate 共享）；令牌挡爬虫，不是身份认证。","无账号体系与云端历史，测速历史只存单键环形缓冲的最近 10 条（且默认关闭）。"],"boundaries_en":["JA3/JA4 fingerprints come from the Cloudflare platform and require Enterprise + Bot Management; elsewhere the field reads N/A.","No traceroute or hop-path and no real MTU probing — neither Workers nor browsers expose ICMP/TTL or fragment control.","Reading the certificate chain directly is impossible (fetch does not expose peer certs); expiry is derived from CT logs.","These endpoints are disabled and return 410: /dns-proxy, /api/ip-fraud, /api/reach-check, /static/*.","Tokens and rate-limit state are per-isolate (not shared across isolates); the token keeps crawlers out but is not identity.","No accounts and no cloud history; speed history is a single-key ring buffer of the latest 10 entries, off by default."],"quickstart":{"lang":"bash","code":"npx wrangler login\nnpx wrangler dev            # http://localhost:8787\nnpx wrangler deploy\n\n# 可选：测速历史 / 监控状态\nnpx wrangler kv namespace create SPEED_HISTORY\nnpx wrangler secret put MONITOR_ADMIN_KEY\n\n# 部署后探活（/health 需要页面会话令牌，脚本请用 /node-ping）\ncurl https://\u003cyour-worker>.workers.dev/node-ping"},"selfcheck_zh":"GET /node-ping 应返回 {ok:true,version:\"4.7.1\",time:…}；直接 curl /health 会得到 403（需页面会话令牌），这是设计如此。","selfcheck_en":"GET /node-ping should return {ok:true,version:\"4.7.1\",time:…}; curl /health returns 403 by design because it requires a page session token.","tags_zh":["网络诊断","DoH","WebRTC","零出站"],"tags_en":["Diagnostics","DoH","WebRTC","Zero egress"]}],"posts":[{"slug":"personal-drive-security","title_zh":"PersonalDrive v5.1.2 安全修复复盘：33 处替换背后的 fail-closed","title_en":"PersonalDrive v5.1.2 security retrospective: fail-closed across 33 replacements","summary_zh":"一次覆盖认证、授权、路径、XSS、SSRF、注入、上传边界、分享链路、分片并发、ZIP、WebDAV 的全量代码审查，最终落地 33 处替换。","summary_en":"A full review across auth, authorisation, paths, XSS, SSRF, injection, upload boundaries, share links, chunk concurrency, ZIP and WebDAV — landing 33 code replacements.","date":"2026-10-02","updated":"","cat":"安全","tags":["安全","代码审查","fail-closed"],"body_zh":"\u003cp>v5.1.2 是建立在一次对 v5.1.1 的完整代码审查之上的安全加固版本（当前线上版本已到 v5.2.0，这些修复都被继承下来）。审查范围覆盖认证授权、路径安全、XSS、SSRF、注入、敏感信息、上传下载边界、分享链路、分片并发、ZIP 解压、WebDAV、配额与版本、错误处理，最终落地 \u003cstrong>33 处代码替换\u003c/strong>。\u003c/p>\n\u003ch3>四类高危问题\u003c/h3>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>问题\u003c/th>\u003cth>修复\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>H1 WebDAV PUT 无大小 / 配额检查\u003c/td>\u003ctd>增加 100 MB 上限与配额前置检查，并改为流式写入，避免整个文件进内存\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H2 URL 抓取可绕过限额\u003c/td>\u003ctd>先 HEAD 探测体积；拿不到就先写、写完校验实际 size，超限回滚并返回 413\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H3 分享链接绕过目录锁\u003c/td>\u003ctd>创建分享前校验锁；分享访问链路上实时校验，命中锁定目录返回 423\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H4 分享密码可无限爆破\u003c/td>\u003ctd>失败分支增加 5 次 / 5 分钟限频\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch3>修复原则\u003c/h3>\n\u003cp>整轮修复遵循四条原则：\u003c/p>\n\u003cul>\u003cli>\u003cstrong>fail-closed\u003c/strong>：配置不完整、判断不出来、解析失败——一律拒绝，而不是放行。这条原则在 SSRF 校验里最明显：DNS 解析失败视为不安全。\u003c/li>\u003cli>\u003cstrong>原子计数\u003c/strong>：分享上传计数改走原子累加，避免并发把配额判断读成同一个旧值。\u003c/li>\u003cli>\u003cstrong>流式限额\u003c/strong>：能流式就不整块进内存；限额要在写入过程中也持续生效，而不能只信 \u003ccode>Content-Length\u003c/code>。\u003c/li>\u003cli>\u003cstrong>锁定边界全覆盖\u003c/strong>：删除目录前递归探测子孙目录是否有锁；锁定子树在列表、搜索、查询、复制、移动、删除、打包、分享、相册、WebDAV 全路径上都要过滤。\u003c/li>\u003c/ul>\n\u003cblockquote>\u003cp>分享密码错误 5 次后，该分享会锁定 5 分钟——这是把爆破成本抬高到不值得，而不是试图彻底杜绝暴力尝试。\u003c/p>\u003c/blockquote>\n\u003ch3>向后兼容\u003c/h3>\n\u003cp>修复后接口保持兼容，前端与既有 API 调用无需改动。口令的无盐历史记录会在首次成功登录后自动迁移为带盐哈希，属于迁移式修复，不改变接口行为。\u003c/p>\n\u003ch3>复盘时最值得记下的两点\u003c/h3>\n\u003cp>\u003cstrong>一、安全的边界要写在代码里，不要写在文档里。\u003c/strong> 这次审查里最花时间的不是写修复，而是确认「某个检查点是不是在所有读路径上都生效了」。文档里一句「锁定目录不可访问」，落到代码上可能是十几个入口。\u003c/p>\n\u003cp>\u003cstrong>二、限额类修复必须假设头部可以撒谎。\u003c/strong> \u003ccode>Content-Length\u003c/code> 是客户端给的，可以缺失、可以偏小，也可以与实际不符。所以体积限制最后都落在「边写边累计 + 超限回滚」上，而不是一个前置判断。\u003c/p>","body_en":"\u003cp>v5.1.2 is a security-hardening release built on a full code review of v5.1.1 (the version live now is v5.2.0, and all of these fixes carried forward). The review covered authentication and authorization, path safety, XSS, SSRF, injection, sensitive data, the upload/download boundary, the sharing path, chunked upload concurrency, ZIP extraction, WebDAV, quotas and versioning, and error handling, and the result was \u003cstrong>33 code replacements\u003c/strong>.\u003c/p>\n\u003ch3>Four high-risk issues\u003c/h3>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Issue\u003c/th>\u003cth>Fix\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>H1 WebDAV PUT had no size or quota check\u003c/td>\u003ctd>Added a 100 MB cap and an upfront quota check, and switched to streaming writes so a whole file never sits in memory\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H2 URL fetching could bypass the quota\u003c/td>\u003ctd>Probe the size with HEAD first; if that fails, write the file and then verify its actual size, rolling back and returning 413 when it goes over the limit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H3 share links bypassed directory locks\u003c/td>\u003ctd>Check the lock before creating a share, and re-check it live along the share access path — hitting a locked directory returns 423\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H4 share passwords could be brute-forced without limit\u003c/td>\u003ctd>Added a rate limit of 5 attempts per 5 minutes on the failure branch\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch3>Guiding principles\u003c/h3>\n\u003cp>The entire round followed four principles:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>fail-closed\u003c/strong>: incomplete configuration, a case that can't be decided, a failed parse — refuse rather than allow. The principle is most visible in SSRF validation: a failed DNS resolution counts as unsafe.\u003c/li>\u003cli>\u003cstrong>Atomic counting\u003c/strong>: share upload counters now use atomic increments, so concurrent requests can't all read the same stale value when checking quota.\u003c/li>\u003cli>\u003cstrong>Streaming limits\u003c/strong>: stream when you can instead of buffering the whole thing; the limit has to stay enforced during the write, not just trusted from \u003ccode>Content-Length\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Lock boundaries covered end to end\u003c/strong>: before deleting a directory, recursively probe its descendants for locks; a locked subtree must be filtered on every path — listing, search, lookup, copy, move, delete, archive, share, albums, WebDAV.\u003c/li>\u003c/ul>\n\u003cblockquote>\u003cp>Five wrong share-password attempts lock that share for five minutes — the point is to make brute-forcing cost more than it's worth, not to stamp out brute-force attempts entirely.\u003c/p>\u003c/blockquote>\n\u003ch3>Backward compatibility\u003c/h3>\n\u003cp>The API stays compatible after the fixes, so the frontend and existing API calls need no changes. Legacy unsalted password records migrate to salted hashes automatically on the first successful login — a migration-style fix that doesn't change API behavior.\u003c/p>\n\u003ch3>Two things worth remembering from the retrospective\u003c/h3>\n\u003cp>\u003cstrong>One: security boundaries belong in the code, not in the docs.\u003c/strong> The most time-consuming part of this review wasn't writing the fixes — it was confirming whether a given checkpoint held on every read path. One line in the docs — “locked directories are inaccessible” — can turn out to be a dozen entry points in code.\u003c/p>\n\u003cp>\u003cstrong>Two: limit fixes have to assume headers lie.\u003c/strong> \u003ccode>Content-Length\u003c/code> comes from the client: it can be missing, too small, or simply wrong. So every size limit ended up as “accumulate while writing, roll back when over” rather than one upfront check.\u003c/p>","words":776,"prev":null,"next":{"slug":"personal-drive-intro","title_zh":"自托管网盘 PersonalDrive：把一整套网盘塞进单个 Worker","title_en":"PersonalDrive: an entire cloud drive inside a single Worker"}},{"slug":"personal-drive-intro","title_zh":"自托管网盘 PersonalDrive：把一整套网盘塞进单个 Worker","title_en":"PersonalDrive: an entire cloud drive inside a single Worker","summary_zh":"R2 存文件、KV 存元数据、可选的 Durable Object 加速目录索引。一份 13,279 行的 Worker 脚本，撑起带完整前端的私人网盘，且按免费额度设计。","summary_en":"Files in R2, metadata in KV, an optional Durable Object accelerating the directory index. One 13,279-line Worker script carrying a complete private cloud drive, designed around the free tier.","date":"2026-09-20","updated":"2026-10-16","cat":"项目","tags":["Cloudflare Workers","R2","KV","WebDAV"],"body_zh":"\u003cp>PersonalDrive 是我在 Cloudflare Workers 上做的自托管网盘，当前版本 \u003cstrong>v5.2.0\u003c/strong>，\u003ccode>_workers.js\u003c/code> 单文件 \u003cstrong>13,279 行 / 795 KB\u003c/strong>，前端（HTML + CSS + 交互）与后端全部内嵌在这一个文件里：无需构建、无运行时依赖、粘贴到 Worker 就能跑。\u003c/p>\n\u003ch3>为什么是 R2 + KV + DO\u003c/h3>\n\u003cp>一个网盘最朴素的分工是「内容存对象、结构存元数据、索引求快」，我按这个拆到三个云原语上：\u003c/p>\n\u003cul>\u003cli>\u003cstrong>R2（绑定名 \u003ccode>DRIVE\u003c/code>）\u003c/strong>：文件本体，以及内部对象——历史版本 \u003ccode>.versions/\u003c/code>、回收站 \u003ccode>.trash/\u003c/code>、分片 \u003ccode>.chunks/\u003c/code>、缩略图 \u003ccode>.thumb/\u003c/code>、备份 \u003ccode>.backup/\u003c/code>。这五个前缀对用户、分享、相册与 WebDAV 全部不可见。\u003c/li>\u003cli>\u003cstrong>KV（绑定名 \u003ccode>STORE\u003c/code>）\u003c/strong>：目录元数据、会话、站点配置、标签、统计与各类索引。\u003cstrong>KV 是元数据的唯一真相源\u003c/strong>。\u003c/li>\u003cli>\u003cstrong>Durable Object（绑定名 \u003ccode>DIR\u003c/code>，类名 \u003ccode>DirStore\u003c/code>）\u003c/strong>：给目录索引加速。它是\u003cstrong>可选\u003c/strong>的加速层，不是依赖——不绑定会自动回退到 KV 模式，功能完全一致，只是大目录遍历与并发改写会慢一些；DO 实例被回收时会自动从 KV 重新播种。\u003c/li>\u003c/ul>\n\u003cp>这里有个我一开始没想清楚的取舍：DO 单值有上限，我在代码里留了 96 KiB 的安全余量（对应 128 KiB 的单值上限）。大目录超出余量时不能硬塞，必须走 KV 合并路径——所以「可选」不只是给人省事的开关，也是架构上的兜底。\u003c/p>\n\u003ch3>几个有意思的实现\u003c/h3>\n\u003cp>\u003cstrong>分片续传\u003c/strong>：超过 5 MB 自动切片（5 MB/片），\u003ccode>chunk-init\u003c/code> / \u003ccode>chunk-upload\u003c/code> / \u003ccode>chunk-complete\u003c/code> 三段式，装配后校验大小；失败任务记在浏览器 localStorage，刷新页面后能接着传；孤儿分片由定时任务回收（默认 24 小时）。\u003c/p>\n\u003cp>\u003cstrong>秒传\u003c/strong>：按内容哈希识别已存在的文件，命中就直接落一条记录，不重复上传；哈希索引有 30 天 TTL。\u003c/p>\n\u003cp>\u003cstrong>URL 抓取\u003c/strong>：输入远程地址直接拉进网盘。这里必须按 SSRF 处理——仅允许 http/https，主机黑名单（localhost、\u003ccode>.local\u003c/code>、\u003ccode>.internal\u003c/code>、云元数据地址段等），\u003cstrong>DNS 解析后再校验一次\u003c/strong>，重定向逐跳检查（最多 5 跳），默认单文件上限 200 MB、10 秒超时；拿不到 \u003ccode>Content-Length\u003c/code> 时先 HEAD 探测，仍然未知就先写入再回滚。\u003c/p>\n\u003ch3>免费额度是硬约束，不是口号\u003c/h3>\n\u003cp>网盘的元数据全在 KV，而免费版 KV 是\u003cstrong>每天 1,000 次写（写入不同键）\u003c/strong>、100,000 次读。所有上传、改名、移动、删除、打标签、建分享都可能产生 KV 写，所以写预算必须自己管起来：\u003c/p>\n\u003cul>\u003cli>每分钟 600 次写预算（滑动窗口）\u003c/li>\u003cli>每日遥测写入预算 500 条——正好是免费额度的一半，给登录会话与目录元数据等关键写留出余量\u003c/li>\u003cli>遥测按 15 秒窗口在内存里合并后再落盘，额度紧张时\u003cstrong>先降级遥测类写入\u003c/strong>，主功能不受影响\u003c/li>\u003cli>多级读缓存：会话 10 秒、配置 30 秒、标签计数 60 秒……\u003c/li>\u003c/ul>\n\u003cp>结论很直白：\u003cstrong>这套架构适合「每天几十次上传/浏览」的个人低频使用\u003c/strong>，不适合高频写入或多人共享。这不是实现偷懒，是免费额度的物理上限决定的。\u003c/p>\n\u003ch3>部署绑定参考\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-toml\">name = &quot;personal-drive&quot;\nmain = &quot;_workers.js&quot;\ncompatibility_date = &quot;2025-01-01&quot;\n\n[[r2_buckets]]\nbinding = &quot;DRIVE&quot;\nbucket_name = &quot;your-bucket&quot;\n\n[[kv_namespaces]]\nbinding = &quot;STORE&quot;\nid = &quot;&lt;你的 KV namespace id&gt;&quot;\n\n[[durable_objects.bindings]]   # 可选：目录索引加速\nname = &quot;DIR&quot;\nclass_name = &quot;DirStore&quot;\n\n[[migrations]]\ntag = &quot;v1&quot;\nnew_sqlite_classes = [&quot;DirStore&quot;]\n\n[triggers]\ncrons = [&quot;17 3 * * *&quot;]          # 可选：回收站 / 分片 / 备份\u003c/code>\u003c/pre>\n\u003cp>绑定名必须完全一致（\u003ccode>DRIVE\u003c/code> / \u003ccode>STORE\u003c/code> / \u003ccode>DIR\u003c/code>），名字不同会导致启动即报错或功能缺失。口令用 Secret 而不是写进 \u003ccode>[vars]\u003c/code>：\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">\u003cspan class=\"tok-kw\">npx\u003c/span> \u003cspan class=\"tok-kw\">wrangler\u003c/span> secret put DRIVE_PASSWORD\n\u003cspan class=\"tok-kw\">npx\u003c/span> \u003cspan class=\"tok-kw\">wrangler\u003c/span> secret put URL_SIGN_SECRET\u003c/code>\u003c/pre>\n\u003cblockquote>\u003cp>注意 \u003ccode>new_sqlite_classes\u003c/code>：Cloudflare 从 2026-07-09 起要求新建的 Durable Object 命名空间必须使用 SQLite 后端，老的 \u003ccode>new_classes\u003c/code> 写法现在会失败。\u003c/p>\u003c/blockquote>\n\u003ch3>部署后自检\u003c/h3>\n\u003cp>访问 \u003ccode>/api/version\u003c/code>，应返回 \u003ccode>version\u003c/code>、\u003ccode>ui\u003c/code> 与 \u003ccode>bindings\u003c/code>，其中 \u003ccode>store\u003c/code> 与 \u003ccode>drive\u003c/code> 必须为 \u003ccode>true\u003c/code>；再上传一个文件、刷新确认仍在，并看一眼页面底部状态条是否显示 \u003ccode>v5.2.0 · flat-1\u003c/code>。\u003c/p>\n\u003ch3>它做不到什么\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>单管理员模型\u003c/strong>，没有多租户隔离；这是个人/小团队自用盘，不是 SaaS。\u003c/li>\u003cli>\u003cstrong>WebDAV 的目录 MOVE/COPY 返回 501\u003c/strong>（请用站内移动 / 复制），\u003ccode>Depth: infinity\u003c/code> 按 1 处理。\u003c/li>\u003cli>\u003cstrong>备份快照只含元数据\u003c/strong>：不含文件本体，也不含 TOTP 密钥；恢复不可撤销，所以重要文件请另存离线副本。\u003c/li>\u003cli>主应用页未启用严格 CSP/SRI；口令哈希是单轮加盐 SHA-256，抗离线暴力弱于 PBKDF2/Argon2。\u003c/li>\u003cli>R2 里文件是明文（只有单文件客户端加密上传这一条路径），不是端到端加密。\u003c/li>\u003c/ul>\n\u003cp>写清楚这些边界不是为了自谦——部署者需要知道自己在承担什么，尤其是「备份不等于文件备份」这一条。\u003c/p>","body_en":"\u003cp>PersonalDrive is a self-hosted cloud drive I built on Cloudflare Workers, currently at version \u003cstrong>v5.2.0\u003c/strong>. It's one \u003ccode>_workers.js\u003c/code> file of \u003cstrong>13,279 lines / 795 KB\u003c/strong> holding both the frontend (HTML + CSS + interaction) and the backend: no build step, no runtime dependencies — paste it into a Worker and it runs.\u003c/p>\n\u003ch3>Why R2 + KV + DO\u003c/h3>\n\u003cp>The simplest split in a cloud drive is “content in objects, structure in metadata, indexes for speed”. I mapped that onto three cloud primitives:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>R2 (binding name \u003ccode>DRIVE\u003c/code>)\u003c/strong>: the files themselves, plus the internal objects — version history \u003ccode>.versions/\u003c/code>, trash \u003ccode>.trash/\u003c/code>, chunks \u003ccode>.chunks/\u003c/code>, thumbnails \u003ccode>.thumb/\u003c/code>, backups \u003ccode>.backup/\u003c/code>. None of these five prefixes is visible to users, shares, albums or WebDAV.\u003c/li>\u003cli>\u003cstrong>KV (binding name \u003ccode>STORE\u003c/code>)\u003c/strong>: directory metadata, sessions, site config, tags, stats and the various indexes.\u003cstrong>KV is the single source of truth for metadata\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Durable Object (binding name \u003ccode>DIR\u003c/code>, class name \u003ccode>DirStore\u003c/code>)\u003c/strong>: it speeds up the directory index. It's an \u003cstrong>optional\u003c/strong> acceleration layer, not a dependency — leave it unbound and it falls back to KV mode automatically, with identical functionality; large directory traversals and concurrent rewrites are just slower. When a DO instance gets evicted it re-seeds itself from KV.\u003c/li>\u003c/ul>\n\u003cp>There's a trade-off here I didn't think through at first: a DO value has a size cap, so I left a 96 KiB safety margin in the code (against the 128 KiB per-value limit). A directory that exceeds the margin can't be crammed in — it has to go through the KV merge path. So “optional” isn't just a convenience switch; it's the architectural backstop.\u003c/p>\n\u003ch3>A few interesting implementation details\u003c/h3>\n\u003cp>\u003cstrong>Resumable chunked upload\u003c/strong>: anything over 5 MB is sliced automatically (5 MB per part) through a three-stage \u003ccode>chunk-init\u003c/code> / \u003ccode>chunk-upload\u003c/code> / \u003ccode>chunk-complete\u003c/code> flow, with a size check after assembly; failed jobs are recorded in browser localStorage and can resume after a page refresh; orphaned chunks are reclaimed by a scheduled job (24 hours by default).\u003c/p>\n\u003cp>\u003cstrong>Instant upload\u003c/strong>: files are identified by content hash, and on a hit it just writes a record and skips the upload; the hash index has a 30-day TTL.\u003c/p>\n\u003cp>\u003cstrong>URL fetch\u003c/strong>: enter a remote address and pull it straight into the drive. This one has to be treated as an SSRF problem — http/https only, a host blocklist (localhost, \u003ccode>.local\u003c/code>, \u003ccode>.internal\u003c/code>, cloud metadata ranges and the like), \u003cstrong>a second validation after DNS resolution\u003c/strong>, per-hop redirect checks (5 hops max), default limits of 200 MB per file and a 10-second timeout; when \u003ccode>Content-Length\u003c/code> isn't available it probes with HEAD first, and if the size is still unknown it writes first and rolls back afterwards.\u003c/p>\n\u003ch3>The free quota is a hard constraint, not a slogan\u003c/h3>\n\u003cp>All of the drive's metadata lives in KV, and free-tier KV gives you \u003cstrong>1,000 writes per day (to distinct keys)\u003c/strong> and 100,000 reads. Every upload, rename, move, delete, tag or share creation can produce a KV write, so I have to manage the write budget myself:\u003c/p>\n\u003cul>\u003cli>A budget of 600 writes per minute (sliding window)\u003c/li>\u003cli>A daily telemetry write budget of 500 entries — exactly half the free quota, leaving headroom for critical writes like login sessions and directory metadata\u003c/li>\u003cli>Telemetry is merged in memory over 15-second windows before it's written out, and when quota runs tight \u003cstrong>telemetry writes are degraded first\u003c/strong>, with core features unaffected\u003c/li>\u003cli>Multi-level read caches: sessions 10 s, config 30 s, tag counts 60 s…\u003c/li>\u003c/ul>\n\u003cp>The conclusion is blunt: \u003cstrong>this architecture suits low-frequency personal use — a few dozen uploads or browses a day\u003c/strong>, not heavy writes or multi-user sharing. That isn't implementation laziness; it's what the physical ceiling of the free quota dictates.\u003c/p>\n\u003ch3>Deployment binding reference\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-toml\">name = &quot;personal-drive&quot;\nmain = &quot;_workers.js&quot;\ncompatibility_date = &quot;2025-01-01&quot;\n\n[[r2_buckets]]\nbinding = &quot;DRIVE&quot;\nbucket_name = &quot;your-bucket&quot;\n\n[[kv_namespaces]]\nbinding = &quot;STORE&quot;\nid = &quot;&lt;your KV namespace id&gt;&quot;\n\n[[durable_objects.bindings]]   # optional: directory index acceleration\nname = &quot;DIR&quot;\nclass_name = &quot;DirStore&quot;\n\n[[migrations]]\ntag = &quot;v1&quot;\nnew_sqlite_classes = [&quot;DirStore&quot;]\n\n[triggers]\ncrons = [&quot;17 3 * * *&quot;]          # optional: trash / chunks / backups\u003c/code>\u003c/pre>\n\u003cp>Binding names must match exactly (\u003ccode>DRIVE\u003c/code> / \u003ccode>STORE\u003c/code> / \u003ccode>DIR\u003c/code>); different names cause errors at startup or missing functionality. Put the password in a Secret rather than in \u003ccode>[vars]\u003c/code>:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">\u003cspan class=\"tok-kw\">npx\u003c/span> \u003cspan class=\"tok-kw\">wrangler\u003c/span> secret put DRIVE_PASSWORD\n\u003cspan class=\"tok-kw\">npx\u003c/span> \u003cspan class=\"tok-kw\">wrangler\u003c/span> secret put URL_SIGN_SECRET\u003c/code>\u003c/pre>\n\u003cblockquote>\u003cp>Note \u003ccode>new_sqlite_classes\u003c/code>: since 2026-07-09 Cloudflare requires new Durable Object namespaces to use the SQLite backend, and the old \u003ccode>new_classes\u003c/code> form now fails.\u003c/p>\u003c/blockquote>\n\u003ch3>Post-deployment self-check\u003c/h3>\n\u003cp>Visit \u003ccode>/api/version\u003c/code>; it should return \u003ccode>version\u003c/code>, \u003ccode>ui\u003c/code> and \u003ccode>bindings\u003c/code>, where \u003ccode>store\u003c/code> and \u003ccode>drive\u003c/code> must be \u003ccode>true\u003c/code>. Then upload a file, refresh and confirm it's still there, and check whether the status bar at the bottom of the page shows \u003ccode>v5.2.0 · flat-1\u003c/code>.\u003c/p>\n\u003ch3>What it can't do\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Single-admin model\u003c/strong>, with no multi-tenant isolation; this is a drive for personal or small-team use, not a SaaS.\u003c/li>\u003cli>\u003cstrong>WebDAV directory MOVE/COPY returns 501\u003c/strong> (use in-app move / copy instead), and \u003ccode>Depth: infinity\u003c/code> is treated as 1.\u003c/li>\u003cli>\u003cstrong>Backup snapshots contain metadata only\u003c/strong>: no file content and no TOTP secret; a restore can't be undone, so keep offline copies of important files.\u003c/li>\u003cli>The main app page doesn't enable strict CSP/SRI; password hashing is single-round salted SHA-256, weaker against offline brute force than PBKDF2/Argon2.\u003c/li>\u003cli>Files in R2 are plaintext (the only exception is the single-file client-side encrypted upload path); this isn't end-to-end encryption.\u003c/li>\u003c/ul>\n\u003cp>Spelling out these boundaries isn't modesty — whoever deploys this needs to know what they're taking on, especially the line about a backup not being a file backup.\u003c/p>","words":1283,"prev":{"slug":"personal-drive-security","title_zh":"PersonalDrive v5.1.2 安全修复复盘：33 处替换背后的 fail-closed","title_en":"PersonalDrive v5.1.2 security retrospective: fail-closed across 33 replacements"},"next":{"slug":"netsight-architecture","title_zh":"NetSight Pro 架构拆解：单 Worker 如何撑起整站网络诊断","title_en":"Inside NetSight Pro: whole-site network diagnostics from one Worker"}},{"slug":"netsight-architecture","title_zh":"NetSight Pro 架构拆解：单 Worker 如何撑起整站网络诊断","title_en":"Inside NetSight Pro: whole-site network diagnostics from one Worker","summary_zh":"23 项工具分 6 组，7,464 行的单个 Worker 文件。设计上的关键取舍是：能在浏览器算的都放浏览器，Worker 只做轻量数据源与代理，默认零出站。","summary_en":"23 tools in 6 groups inside one 7,464-line Worker file. The core trade-off: anything computable in the browser stays in the browser, leaving the Worker as a thin data source and proxy with zero egress by default.","date":"2026-09-05","updated":"2026-10-16","cat":"架构","tags":["Workers","网络诊断","单文件"],"body_zh":"\u003cp>NetSight Pro 当前版本 \u003cstrong>v4.7.1\u003c/strong>，单文件 \u003cstrong>7,464 行 / 416 KB\u003c/strong>，零运行时依赖。它把链路可观测数据摊开在同一个界面里：实时 RTT 与抖动、带宽与吞吐、DNS、站点安全头审计、WebRTC 泄漏、代理/VPN 判定。\u003c/p>\n\u003ch3>23 项工具，按用途分 6 组\u003c/h3>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>分组\u003c/th>\u003cth>数量\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>网络质量与延迟\u003c/td>\u003ctd>7\u003c/td>\u003ctd>一键体检、长时质量监控、丢包率、TTFB 分阶段、WebSocket 往返、代理/VPN 检测、WebRTC 泄漏\u003c/td>\u003c/tr>\u003ctr>\u003ctd>带宽与吞吐\u003c/td>\u003ctd>6\u003c/td>\u003ctd>上下行测速、多流并发、上传测速、缓冲膨胀、流式吞吐、并发连接\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DNS\u003c/td>\u003ctd>3\u003c/td>\u003ctd>解析、工具箱、多解析器对比\u003c/td>\u003c/tr>\u003ctr>\u003ctd>安全与合规\u003c/td>\u003ctd>2\u003c/td>\u003ctd>站点体检（含证书到期）、域名安全体检\u003c/td>\u003c/tr>\u003ctr>\u003ctd>可达性与多节点\u003c/td>\u003ctd>3\u003c/td>\u003ctd>流媒体连通性、网络可达性、多节点对比\u003c/td>\u003c/tr>\u003ctr>\u003ctd>监控与系统\u003c/td>\u003ctd>2\u003c/td>\u003ctd>站点监控（可选 Cron）、CPU 性能\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>界面用标签区分数据流向：绿色是浏览器侧完成（\u003cstrong>零 Worker 出站\u003c/strong>），黄色才需要 Worker 代你发请求。这个区分不是装饰——它决定了「谁在替我花钱、谁在看我流量」。\u003c/p>\n\u003ch3>前后端如何塞进一个 Worker\u003c/h3>\n\u003cp>后端就是一个 \u003ccode>export default { fetch }\u003c/code>，按路径分发。仍在服务的端点大致分三类：\u003c/p>\n\u003cp>\u003cstrong>测量类\u003c/strong>（浏览器主动来打）：\u003ccode>/speedtest\u003c/code>、\u003ccode>/upload-test\u003c/code>、\u003ccode>/stream-test\u003c/code>、\u003ccode>/concurrent-test\u003c/code>、\u003ccode>/ws-test\u003c/code>、\u003ccode>/cpu-test\u003c/code>、\u003ccode>/node-ping\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>代理类\u003c/strong>（Worker 代发请求）：DNS over HTTPS 查询、站点体检 \u003ccode>/api/site-audit\u003c/code>、可选的站点监控巡检与 Webhook。\u003c/p>\n\u003cp>\u003cstrong>页面类\u003c/strong>：主页、\u003ccode>/health\u003c/code>（会话令牌校验）、\u003ccode>/manifest.webmanifest\u003c/code>、\u003ccode>/sw.js\u003c/code>、图标。\u003c/p>\n\u003cp>有四个端点已经\u003cstrong>停用\u003c/strong>，统一返回 410：\u003ccode>/dns-proxy\u003c/code>、\u003ccode>/api/ip-fraud\u003c/code>、\u003ccode>/api/reach-check\u003c/code>、\u003ccode>/static/*\u003c/code>。前两个是设计上主动关掉的——\u003ccode>/dns-proxy\u003c/code> 的开放代理属性与零出站目标冲突，服务端 IP 风险评分需要第三方出站，都不做了。\u003c/p>\n\u003ch3>前端是原生 SPA\u003c/h3>\n\u003cp>没有用任何前端框架：工具卡片、结果弹层、Canvas 2D 实时折线图、WebSocket 双向测试全部原生 JS。三语言（EN / 简体 / 繁體）键集完全一致，默认按 \u003ccode>Accept-Language\u003c/code> 判定，兜底英文。\u003c/p>\n\u003cp>页面响应带 nonce CSP（\u003ccode>script-src &#39;self&#39; &#39;nonce-…&#39;\u003c/code>、\u003ccode>object-src &#39;none&#39;\u003c/code>、\u003ccode>frame-ancestors &#39;none&#39;\u003c/code>），HSTS 到 preload，\u003ccode>X-Frame-Options: DENY\u003c/code>。主页面签发 1 小时会话令牌（HttpOnly Cookie + \u003ccode>x-ns-token\u003c/code> 头兜底），用来挡爬虫——它不是身份认证，作者在 SECURITY.md 里也是这么写的。\u003c/p>\n\u003ch3>可控的可靠性\u003c/h3>\n\u003cp>免费计划的 CPU 预算是 10 ms/请求，所以：\u003c/p>\n\u003cul>\u003cli>CPU 基准测试的迭代上限压在预算内，避免 1102 超时\u003c/li>\u003cli>带宽端点体积收敛，\u003ccode>/speedtest\u003c/code> 单次上限 64 MiB，上传端点 32 MB\u003c/li>\u003cli>限流分桶：默认 60 次/分/IP，\u003ccode>/health\u003c/code> 180 次/分，大响应下载 30 次/分，\u003ccode>/cpu-test\u003c/code> 3 次/分\u003c/li>\u003cli>KV 写入走统一闸门：\u003cstrong>20 次/分、600 次/日、同键 10 秒去抖\u003c/strong>，超预算的非关键写入直接丢弃并计数\u003c/li>\u003cli>所有绑定都是\u003cstrong>软依赖\u003c/strong>：不绑 KV 也能跑，只是用量统计退化为 isolate 内存\u003c/li>\u003c/ul>\n\u003ch3>平台做不了的三件事\u003c/h3>\n\u003col>\u003cli>\u003cstrong>traceroute / 跳数路径\u003c/strong>：Workers 与浏览器都不提供 ICMP 或 TTL 控制，做不了，不做。\u003c/li>\u003cli>\u003cstrong>真实 MTU 探测\u003c/strong>：无法控制 DF 标志与分片。\u003c/li>\u003cli>\u003cstrong>直读对端证书链\u003c/strong>：\u003ccode>fetch\u003c/code> 不暴露对端证书，所以证书到期改成走 CT 日志（crt.sh，缓存 30 分钟），比直连读多一次外部依赖。\u003c/li>\u003c/ol>\n\u003cp>还有一个必须说清的限制：\u003cstrong>JA3 / JA4 指纹字段由 Cloudflare 平台提供，只有 Enterprise + Bot Management 才有值\u003c/strong>。代码里读的是 \u003ccode>request.cf.tlsClientJa3/Ja4\u003c/code>，普通环境（包括免费计划）显示 \u003ccode>N/A\u003c/code>。这不是功能坏了，是平台能力边界。\u003c/p>\n\u003cblockquote>\u003cp>整个项目的哲学：能算的都放浏览器，Worker 只负责轻量数据源与代理，这样首屏不被第三方接口拖慢，也把免费额度花在刀刃上。\u003c/p>\u003c/blockquote>","body_en":"\u003cp>NetSight Pro is at \u003cstrong>v4.7.1\u003c/strong> today: one file, \u003cstrong>7,464 lines / 416 KB\u003c/strong>, zero runtime dependencies. It lays connection observability data out in a single interface — live RTT and jitter, bandwidth and throughput, DNS, site security header audits, WebRTC leaks, proxy/VPN detection.\u003c/p>\n\u003ch3>23 tools, split into 6 groups by purpose\u003c/h3>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Group\u003c/th>\u003cth>Count\u003c/th>\u003cth>Contents\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Network quality and latency\u003c/td>\u003ctd>7\u003c/td>\u003ctd>One-click checkup, long-run quality monitoring, packet loss, TTFB phase breakdown, WebSocket round trip, proxy/VPN detection, WebRTC leaks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bandwidth and throughput\u003c/td>\u003ctd>6\u003c/td>\u003ctd>Up/down speed test, multi-stream concurrency, upload speed test, bufferbloat, streaming throughput, concurrent connections\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DNS\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Resolution, toolbox, multi-resolver comparison\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Security and compliance\u003c/td>\u003ctd>2\u003c/td>\u003ctd>Site checkup (certificate expiry included), domain security checkup\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reachability and multi-node\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Streaming connectivity, network reachability, multi-node comparison\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Monitoring and system\u003c/td>\u003ctd>2\u003c/td>\u003ctd>Site monitoring (optional Cron), CPU performance\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>The UI labels each tool by the direction its data flows: green means it runs in the browser (\u003cstrong>zero Worker egress\u003c/strong>), yellow means the Worker has to send the request for you. That distinction is not decoration — it decides who spends my money and who gets to see my traffic.\u003c/p>\n\u003ch3>How the frontend and backend fit into one Worker\u003c/h3>\n\u003cp>The backend is just an \u003ccode>export default { fetch }\u003c/code> that dispatches on path. The endpoints still in service fall into roughly three kinds:\u003c/p>\n\u003cp>\u003cstrong>Measurement\u003c/strong> (the browser hits these directly): \u003ccode>/speedtest\u003c/code>, \u003ccode>/upload-test\u003c/code>, \u003ccode>/stream-test\u003c/code>, \u003ccode>/concurrent-test\u003c/code>, \u003ccode>/ws-test\u003c/code>, \u003ccode>/cpu-test\u003c/code>, \u003ccode>/node-ping\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Proxy\u003c/strong> (the Worker sends the request): DNS over HTTPS queries, the site checkup \u003ccode>/api/site-audit\u003c/code>, and the optional site monitoring sweeps plus Webhook.\u003c/p>\n\u003cp>\u003cstrong>Pages\u003c/strong>: the home page, \u003ccode>/health\u003c/code> (session token validation), \u003ccode>/manifest.webmanifest\u003c/code>, \u003ccode>/sw.js\u003c/code>, and the icons.\u003c/p>\n\u003cp>Four endpoints are \u003cstrong>retired\u003c/strong> and all return 410: \u003ccode>/dns-proxy\u003c/code>, \u003ccode>/api/ip-fraud\u003c/code>, \u003ccode>/api/reach-check\u003c/code>, \u003ccode>/static/*\u003c/code>. The first two were shut off by design — \u003ccode>/dns-proxy\u003c/code> is an open proxy, which conflicts with the zero-egress goal, and server-side IP risk scoring needs third-party egress, so I dropped both.\u003c/p>\n\u003ch3>The frontend is a vanilla SPA\u003c/h3>\n\u003cp>No frontend framework anywhere: tool cards, result modals, live Canvas 2D line charts, and the bidirectional WebSocket test are all plain JS. The three locales (EN / Simplified / Traditional) share an identical key set, picked from \u003ccode>Accept-Language\u003c/code> with English as the fallback.\u003c/p>\n\u003cp>Page responses carry a nonce CSP (\u003ccode>script-src &#39;self&#39; &#39;nonce-…&#39;\u003c/code>, \u003ccode>object-src &#39;none&#39;\u003c/code>, \u003ccode>frame-ancestors &#39;none&#39;\u003c/code>), HSTS up to preload, and \u003ccode>X-Frame-Options: DENY\u003c/code>. The home page issues a one-hour session token (HttpOnly cookie plus an \u003ccode>x-ns-token\u003c/code> header fallback) to hold crawlers off — it is not authentication, and I say so in SECURITY.md.\u003c/p>\n\u003ch3>Reliability I can control\u003c/h3>\n\u003cp>The free plan budgets 10 ms of CPU per request, so:\u003c/p>\n\u003cul>\u003cli>The CPU benchmark caps its iteration count to stay inside that budget and avoid 1102 timeouts\u003c/li>\u003cli>Bandwidth endpoints keep payloads small: \u003ccode>/speedtest\u003c/code> caps a single run at 64 MiB, the upload endpoint at 32 MB\u003c/li>\u003cli>Rate limits are bucketed: 60/min/IP by default, 180/min for \u003ccode>/health\u003c/code>, 30/min for large-response downloads, 3/min for \u003ccode>/cpu-test\u003c/code>\u003c/li>\u003cli>KV writes go through a single gate: \u003cstrong>20/min, 600/day, 10-second debounce per key\u003c/strong>, and non-critical writes over budget are dropped and counted\u003c/li>\u003cli>Every binding is a \u003cstrong>soft dependency\u003c/strong>: it runs with no KV bound; only usage stats degrade to isolate memory\u003c/li>\u003c/ul>\n\u003ch3>Three things the platform cannot do\u003c/h3>\n\u003col>\u003cli>\u003cstrong>traceroute / hop-by-hop path\u003c/strong>: neither Workers nor browsers expose ICMP or TTL control, so it cannot be done, and I do not do it.\u003c/li>\u003cli>\u003cstrong>Real MTU probing\u003c/strong>: no way to control the DF flag or fragmentation.\u003c/li>\u003cli>\u003cstrong>Reading the peer certificate chain directly\u003c/strong>: \u003ccode>fetch\u003c/code> does not expose the peer certificate, so certificate expiry comes from CT logs instead (crt.sh, cached for 30 minutes) — one extra external dependency compared with reading it directly.\u003c/li>\u003c/ol>\n\u003cp>One more limit worth stating plainly: \u003cstrong>the JA3 / JA4 fingerprint fields come from the Cloudflare platform and only have values on Enterprise plus Bot Management\u003c/strong>. The code reads \u003ccode>request.cf.tlsClientJa3/Ja4\u003c/code>; ordinary environments, the free plan included, show \u003ccode>N/A\u003c/code>. That is not a broken feature — it is where the platform stops.\u003c/p>\n\u003cblockquote>\u003cp>The philosophy behind the whole project: anything that can be computed goes in the browser, and the Worker only handles lightweight data sources and proxying, so third-party APIs never slow the first paint and the free allowance is spent where it counts.\u003c/p>\u003c/blockquote>","words":1049,"prev":{"slug":"personal-drive-intro","title_zh":"自托管网盘 PersonalDrive：把一整套网盘塞进单个 Worker","title_en":"PersonalDrive: an entire cloud drive inside a single Worker"},"next":{"slug":"netsight-ssrf","title_zh":"在 Cloudflare Worker 上做 SSRF 防护：协议白名单与 DNS 解析后校验","title_en":"SSRF defence on a Cloudflare Worker: protocol allowlists and post-DNS validation"}},{"slug":"netsight-ssrf","title_zh":"在 Cloudflare Worker 上做 SSRF 防护：协议白名单与 DNS 解析后校验","title_en":"SSRF defence on a Cloudflare Worker: protocol allowlists and post-DNS validation","summary_zh":"接受任意 URL 的端点怎么防止被当作跳板去打内网、云元数据与保留地址——四层校验，加上「解析失败即拒绝」。","summary_en":"How endpoints that accept arbitrary URLs avoid becoming a proxy into private networks, cloud metadata and reserved ranges — four layers plus deny-on-parse-failure.","date":"2026-08-22","updated":"","cat":"安全","tags":["SSRF","安全","Worker"],"body_zh":"\u003cp>NetSight Pro 里有几个端点会接受用户传入的地址并代为发起请求：站点体检、可选的站点监控巡检、以及 Webhook 通知。这类「任意 URL 抓取」是 SSRF 的高发区——防护不到位，你的 Worker 就成了一台位于 Cloudflare 网络里的代理，可以探测内网服务、读取云元数据、扫描保留网段。\u003c/p>\n\u003cp>顺便说明：早期版本里的 \u003ccode>/dns-proxy\u003c/code> 这个开放代理端点\u003cstrong>已经停用\u003c/strong>，现在统一返回 410。开放代理与「默认零 Worker 出站」的目标直接冲突，与其加一堆限制，不如关掉。\u003c/p>\n\u003ch3>四层校验\u003c/h3>\n\u003cp>\u003cstrong>一、协议白名单。\u003c/strong> 只允许 \u003ccode>http\u003c/code> 与 \u003ccode>https\u003c/code>，其余一律拒绝。协议判断放在最前面，因为它最便宜。\u003c/p>\n\u003cp>\u003cstrong>二、端口白名单。\u003c/strong> 只放行默认端口（空）、\u003ccode>80\u003c/code>、\u003ccode>443\u003c/code>。很多内网服务跑在非常规端口上，端口限制能挡掉一批。\u003c/p>\n\u003cp>\u003cstrong>三、主机名与网段黑名单。\u003c/strong> 主机名层面拦截 \u003ccode>localhost\u003c/code>、\u003ccode>*.localhost\u003c/code>、\u003ccode>*.local\u003c/code>、\u003ccode>*.internal\u003c/code>、\u003ccode>*.home.arpa\u003c/code>，以及没有点的主机名；IP 层面覆盖 IPv4 的 \u003ccode>0.0.0.0/8\u003c/code>、\u003ccode>10/8\u003c/code>、\u003ccode>127/8\u003c/code>、\u003ccode>169.254/16\u003c/code>、\u003ccode>172.16/12\u003c/code>、\u003ccode>192.168/16\u003c/code>、\u003ccode>100.64/10\u003c/code>、\u003ccode>192.0.0/24\u003c/code>、\u003ccode>198.18/15\u003c/code>、\u003ccode>≥224/4\u003c/code>，以及 IPv6 的 \u003ccode>::\u003c/code>、\u003ccode>::1\u003c/code>、\u003ccode>fc00::/7\u003c/code>、\u003ccode>fe80::/10\u003c/code>、\u003ccode>ff00::/8\u003c/code>、\u003ccode>2002::/16\u003c/code>、\u003ccode>2001::/32\u003c/code>、\u003ccode>2001:db8::/32\u003c/code>，还有 IPv4 映射地址 \u003ccode>::ffff:0:0/96\u003c/code> 与 NAT64 的 \u003ccode>64:ff9b::/96\u003c/code>——后两类最容易被忽略，因为字符串看起来完全不像内网地址。\u003c/p>\n\u003cp>\u003cstrong>四、DNS 解析后再校验。\u003c/strong> 这一层是关键：域名本身可能是干净的，但解析结果指向 \u003ccode>127.0.0.1\u003c/code> 或云元数据地址。所以要在真正发起连接前用 DoH 查一次 A/AAAA，并\u003cstrong>要求所有解析结果都是公网地址\u003c/strong>，只要有一个落在黑名单里就拒绝；解析失败、没有结果，同样视为不安全。\u003c/p>\n\u003cpre>\u003ccode class=\"lang-js\">// 1. 协议白名单：只允许 http / https\nif (!/^https?:\\/\\//i.test(url)) return reject(400);\n// 2. 端口白名单：只放行默认端口、80、443\nif (!ALLOWED_PORTS.has(port)) return reject(400);\n// 3. 主机名与网段黑名单（含 IPv4 映射与 NAT64）\nif (isPrivateHost(host)) return reject(403);\n// 4. DNS 解析后再校验：所有结果都必须是公网地址\nconst ips = await resolveViaDoH(host);\nif (!ips.length || ips.some(isPrivateIp)) return reject(403);\u003c/code>\u003c/pre>\n\u003ch3>还有两件事\u003c/h3>\n\u003cp>\u003cstrong>重定向要逐跳复检。\u003c/strong> 用 \u003ccode>redirect: &#39;manual&#39;\u003c/code> 自己跟，最多 6 跳，而且\u003cstrong>每一跳都要重新做上面四层校验\u003c/strong>。只检查初始 URL 等于没检查——攻击者只要让第一跳指向一个会 302 到内网的公开地址就够了。\u003c/p>\n\u003cp>\u003cstrong>超时与体积上限。\u003c/strong> 请求带超时（DNS 3 秒、站点体检 8 秒、监控 10 秒），响应体有上限（证书检查 1.2 MB），并且整体可以一键关闭抓取功能。\u003c/p>\n\u003cblockquote>\u003cp>安全修复的基本原则是 fail-closed：判断不出来、解析失败，一律拒绝，而不是放行。这句话写起来一行，落到每一层校验上是一整套分支。\u003c/p>\u003c/blockquote>","body_en":"\u003cp>NetSight Pro has a few endpoints that take an address from the user and fetch it on their behalf: site checks, the optional site-monitoring probes, and webhook notifications. This kind of “fetch any URL” feature is a classic SSRF hotspot — without solid defenses, your Worker turns into a proxy sitting inside Cloudflare's network, able to probe internal services, read cloud metadata, and scan reserved ranges.\u003c/p>\n\u003cp>One side note: the open-proxy endpoint \u003ccode>/dns-proxy\u003c/code> from early versions \u003cstrong>is retired\u003c/strong>, and now returns 410 across the board. An open proxy runs straight against the goal of “zero Worker egress by default”, so instead of piling on restrictions I turned it off.\u003c/p>\n\u003ch3>Four layers of validation\u003c/h3>\n\u003cp>\u003cstrong>One: protocol allowlist.\u003c/strong> Only \u003ccode>http\u003c/code> and \u003ccode>https\u003c/code> are allowed; everything else is rejected. The scheme check comes first because it's the cheapest.\u003c/p>\n\u003cp>\u003cstrong>Two: port allowlist.\u003c/strong> Only the default port (empty), \u003ccode>80\u003c/code>, and \u003ccode>443\u003c/code> get through. Plenty of internal services run on non-standard ports, so this alone blocks a fair number of them.\u003c/p>\n\u003cp>\u003cstrong>Three: hostname and network blocklist.\u003c/strong> At the hostname level it blocks \u003ccode>localhost\u003c/code>, \u003ccode>*.localhost\u003c/code>, \u003ccode>*.local\u003c/code>, \u003ccode>*.internal\u003c/code>, \u003ccode>*.home.arpa\u003c/code>, plus any hostname with no dot in it. At the IP level, for IPv4 it covers \u003ccode>0.0.0.0/8\u003c/code>, \u003ccode>10/8\u003c/code>, \u003ccode>127/8\u003c/code>, \u003ccode>169.254/16\u003c/code>, \u003ccode>172.16/12\u003c/code>, \u003ccode>192.168/16\u003c/code>, \u003ccode>100.64/10\u003c/code>, \u003ccode>192.0.0/24\u003c/code>, \u003ccode>198.18/15\u003c/code>, and \u003ccode>≥224/4\u003c/code>; for IPv6 \u003ccode>::\u003c/code>, \u003ccode>::1\u003c/code>, \u003ccode>fc00::/7\u003c/code>, \u003ccode>fe80::/10\u003c/code>, \u003ccode>ff00::/8\u003c/code>, \u003ccode>2002::/16\u003c/code>, \u003ccode>2001::/32\u003c/code>, \u003ccode>2001:db8::/32\u003c/code>; and the IPv4-mapped block \u003ccode>::ffff:0:0/96\u003c/code> together with NAT64's \u003ccode>64:ff9b::/96\u003c/code> — those last two are the easiest to miss, because the strings look nothing like an internal address.\u003c/p>\n\u003cp>\u003cstrong>Four: validate again after DNS resolution.\u003c/strong> This layer is the key one: the domain itself may be clean, but its resolution points at \u003ccode>127.0.0.1\u003c/code> or a cloud metadata address. So before opening the actual connection it looks up A/AAAA over DoH, and \u003cstrong>requires every resolved address to be public\u003c/strong> — one result inside a blocked range is enough to reject; a failed lookup or an empty answer counts as unsafe too.\u003c/p>\n\u003cpre>\u003ccode class=\"lang-js\">// 1. Protocol allowlist: only http / https\nif (!/^https?:\\/\\//i.test(url)) return reject(400);\n// 2. Port allowlist: default ports, 80 and 443 only\nif (!ALLOWED_PORTS.has(port)) return reject(400);\n// 3. Hostname and CIDR blocklist (incl. IPv4-mapped and NAT64)\nif (isPrivateHost(host)) return reject(403);\n// 4. Validate again after DNS resolution: every result must be public\nconst ips = await resolveViaDoH(host);\nif (!ips.length || ips.some(isPrivateIp)) return reject(403);\u003c/code>\u003c/pre>\n\u003ch3>Two more things\u003c/h3>\n\u003cp>\u003cstrong>Redirects need a fresh check at every hop.\u003c/strong> Follow them yourself with \u003ccode>redirect: &#39;manual&#39;\u003c/code>, 6 hops max, and \u003cstrong>repeat all four checks above at every hop\u003c/strong>. Checking only the initial URL is as good as checking nothing — an attacker only needs the first hop to point at a public address that 302s into the internal network.\u003c/p>\n\u003cp>\u003cstrong>Timeouts and body size caps.\u003c/strong> Requests carry timeouts (3 seconds for DNS, 8 for site checks, 10 for monitoring), response bodies are capped (1.2 MB for certificate checks), and the whole fetch feature can be switched off with one flag.\u003c/p>\n\u003cblockquote>\u003cp>The basic principle of a security fix is fail-closed: if you can't decide, or resolution fails, refuse rather than allow. That sentence is one line to write, but landing it on every layer of validation is a whole tree of branches.\u003c/p>\u003c/blockquote>","words":696,"prev":{"slug":"netsight-architecture","title_zh":"NetSight Pro 架构拆解：单 Worker 如何撑起整站网络诊断","title_en":"Inside NetSight Pro: whole-site network diagnostics from one Worker"},"next":{"slug":"single-file-craft","title_zh":"单文件 Worker 工程的取舍：为什么我坚持把一切塞进一个文件","title_en":"The single-file Worker trade-off: why everything goes into one file"}},{"slug":"single-file-craft","title_zh":"单文件 Worker 工程的取舍：为什么我坚持把一切塞进一个文件","title_en":"The single-file Worker trade-off: why everything goes into one file","summary_zh":"一个 13,279 行的 JS 文件既没有模块化也没有构建步骤，看似违反直觉，却在「粘贴即部署」的场景里异常好用——前提是你接受它的代价。","summary_en":"A 13,279-line JavaScript file with no modules and no build step looks backwards, yet it works remarkably well for paste-and-deploy — provided you accept the price.","date":"2026-08-10","updated":"2026-10-16","cat":"工程","tags":["工程","单文件","实践"],"body_zh":"\u003cp>我的两个开源项目都不约而同选择了「单文件 Worker」：PersonalDrive \u003cstrong>13,279 行 / 795 KB\u003c/strong>，NetSight Pro \u003cstrong>7,464 行 / 416 KB\u003c/strong>。明明有模块化、有打包器，为什么偏要一个文件到底？\u003c/p>\n\u003ch3>换来的是什么\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>零构建、零依赖\u003c/strong>：不需要 \u003ccode>npm install\u003c/code>，不需要 bundle，把文件内容粘到 Cloudflare 控制台就能部署；对使用者来说没有供应链风险，也没有「三个月后构建链断了」的风险。\u003c/li>\u003cli>\u003cstrong>一份产物即一次部署\u003c/strong>：版本号就是代码里的一个字符串，部署和回滚都是整份替换，不存在「哪几个 chunk 是新的」这种问题。\u003c/li>\u003cli>\u003cstrong>可读可审\u003c/strong>：做安全审查时把一份文件从头读到尾，覆盖面和上下文反而更清楚——不会出现「这个检查在另一个包的第 300 行」的断层。\u003c/li>\u003cli>\u003cstrong>对分发友好\u003c/strong>：别人 clone 下来只有一个文件要看，改一处不用理解构建配置。\u003c/li>\u003c/ul>\n\u003ch3>付出的代价\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>没有真正的代码分割\u003c/strong>：前端资源（HTML / CSS / JS）随每次请求一起下发，首屏体积换取了部署简单。\u003c/li>\u003cli>\u003cstrong>命名空间会变长\u003c/strong>：两个项目里都有大量前缀式命名，读起来不如模块清晰。\u003c/li>\u003cli>\u003cstrong>协作 diff 体验一般\u003c/strong>：多人同时改一个大文件，冲突概率明显高于多文件工程。\u003c/li>\u003cli>\u003cstrong>必须靠纪律维持秩序\u003c/strong>：我在文件头写了分区注释（i18n → 路由 → 业务 → 视图 → 工具），并且坚持「新增能力必须挂到已有分区，不另起炉灶」，否则一万多行很快就会失控。\u003c/li>\u003c/ul>\n\u003ch3>什么时候值得\u003c/h3>\n\u003cp>当产品是\u003cstrong>个人自托管小工具\u003c/strong>、希望别人 clone 下来就能跑、或者希望把运维复杂度压到最低时，单文件是一个被低估的选择。它在云原语（R2 / KV / DO）的语境下尤其好用——你不需要一个应用框架，你需要的只是一个分发入口。\u003c/p>\n\u003cp>反过来，如果满足下面任意一条，就别硬塞单文件：需要多人长期维护、需要按需加载以控制首屏、需要类型系统兜住复杂业务、或者需要给第三方提供稳定的库接口。\u003c/p>\n\u003cblockquote>\u003cp>能跑就行，跑得漂亮更好——但维护成本永远要跟产品规模匹配。\u003c/p>\u003c/blockquote>\n\u003cp>另外补一句很实际的话：单文件的「可审计」优势是建立在你\u003cstrong>真的会读它\u003c/strong>的前提上的。如果一份一万三千行的文件从没人从头看过，那它同时继承了单文件的缺点和多文件工程的缺点——这是最糟的组合。\u003c/p>","body_en":"\u003cp>Both of my open-source projects ended up as single-file Workers: PersonalDrive at \u003cstrong>13,279 lines / 795 KB\u003c/strong> and NetSight Pro at \u003cstrong>7,464 lines / 416 KB\u003c/strong>. There are module systems and bundlers, so why push everything into one file?\u003c/p>\n\u003ch3>What you get\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>No build, no dependencies.\u003c/strong> No \u003ccode>npm install\u003c/code>, no bundle step — paste the file into the Cloudflare dashboard and it runs. For anyone using it, that means no supply-chain surface and no &quot;the build broke three months later&quot; failure mode.\u003c/li>\u003cli>\u003cstrong>One artifact is one deployment.\u003c/strong> The version is a string inside the code; deploying and rolling back are whole-file replacements, with no question of which chunk is new.\u003c/li>\u003cli>\u003cstrong>Auditable in one pass.\u003c/strong> Reading a single file from top to bottom gives you the whole security surface with full context — no &quot;that check actually lives 300 lines into another package&quot; gaps.\u003c/li>\u003cli>\u003cstrong>Friendly to distribution.\u003c/strong> Someone cloning the repo has one file to read and no build config to understand.\u003c/li>\u003c/ul>\n\u003ch3>What you pay\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>No real code splitting.\u003c/strong> HTML, CSS and JS ship with every request; a larger first response buys deployment simplicity.\u003c/li>\u003cli>\u003cstrong>Namespaces grow long.\u003c/strong> Both projects lean on prefixed identifiers, which reads worse than proper modules.\u003c/li>\u003cli>\u003cstrong>Diffs get awkward.\u003c/strong> Several people editing one large file collide far more often than in a multi-file project.\u003c/li>\u003cli>\u003cstrong>Order depends on discipline.\u003c/strong> I keep a sectioned header (i18n → routing → business → views → utils) and a rule that new capability must attach to an existing section rather than starting a new one. Without that, thirteen thousand lines gets away from you fast.\u003c/li>\u003c/ul>\n\u003ch3>When it is worth it\u003c/h3>\n\u003cp>It is underrated when the product is a \u003cstrong>personal self-hosted tool\u003c/strong>, when you want people to clone and run it immediately, or when you want operations complexity at zero. It fits especially well next to cloud primitives (R2 / KV / DO): you do not need an application framework, you need a distribution entry point.\u003c/p>\n\u003cp>Conversely, avoid forcing a single file when any of these is true: several people maintain it long term, first-load size needs code splitting, a type system has to hold complex business logic, or you need to expose a stable library interface to third parties.\u003c/p>\n\u003cblockquote>\u003cp>Working beats pretty, but maintenance cost always has to match the size of the product.\u003c/p>\u003c/blockquote>\n\u003cp>One practical caveat: the auditability argument only holds if someone actually reads the file. A 13,000-line script nobody has read end to end inherits the downsides of a single file \u003cem>and\u003c/em> the downsides of a sprawling codebase — the worst of both.\u003c/p>","words":751,"prev":{"slug":"netsight-ssrf","title_zh":"在 Cloudflare Worker 上做 SSRF 防护：协议白名单与 DNS 解析后校验","title_en":"SSRF defence on a Cloudflare Worker: protocol allowlists and post-DNS validation"},"next":null}]};</script>

  /* ================= router ================= */
  function parseRoute() {
    var h = (location.hash || "").replace(/^#/, "");
    if (!h || h === "/") return { name: "home" };
    var parts = h.replace(/^\/+/, "").split("/");
    if (parts[0] === "work") {
      if (parts[1]) return { name: "workDetail", id: parts[1] };
      return { name: "work" };
    }
    if (parts[0] === "writing") {
      if (parts[1]) return { name: "post", slug: parts[1] };
      return { name: "writing" };
    }
    if (parts[0] === "notes") return { name: "notes" };
    if (parts[0] === "about") return { name: "about" };
    return { name: "notfound" };
  }

  function titleFor(r) {
    var sep = t("title.sep");
    if (r.name === "home") return site.brand_zh && lang !== "en" ? site.brand_zh : (site.brand_en || site.brand_zh);
    if (r.name === "work") return t("page.work.title") + sep + t("brand.name");
    if (r.name === "workDetail") { var p = productById(r.id); return (p ? p.name : t("notfound.title")) + sep + t("brand.name"); }
    if (r.name === "writing") return t("page.writing.title") + sep + t("brand.name");
    if (r.name === "post") { var po = postBySlug(r.slug); return (po ? pick(po, "title") : t("notfound.title")) + sep + t("brand.name"); }
    if (r.name === "notes") return t("page.notes.title") + sep + t("brand.name");
    if (r.name === "about") return t("page.about.title") + sep + t("brand.name");
    return t("notfound.title") + sep + t("brand.name");
  }

  var app = document.getElementById("app");
  var announcer = document.getElementById("announcer");

  var renderedOnce = false;
  var lastRouteKey = "";
  function updateMeta(r, title) {
    function set(sel, attr, val) { var el = document.querySelector(sel); if (el && val) el.setAttribute(attr, val); }
    var desc = lang === "en" ? (site.lead_en || "") : (site.lead_zh || "");
    var isPost = r.name === "post";
    var p = isPost ? postBySlug(r.slug) : null;
    if (isPost && p) desc = pick(p, "summary");
    if (r.name === "workDetail") { var pp = productById(r.id); if (pp) desc = pick(pp, "summary"); }
    set('meta[name="description"]', "content", desc);
    set('meta[property="og:title"]', "content", title);
    set('meta[property="og:description"]', "content", desc);
    set('meta[name="twitter:title"]', "content", title);
    set('meta[name="twitter:description"]', "content", desc);
    var ogUrl = "https://blog.bjhr.online/";
    set('meta[property="og:url"]', "content", ogUrl);
  }

  function render() {
    var r = parseRoute();
    var html;
    if (r.name === "home") html = vHome();
    else if (r.name === "work") html = vWorkList();
    else if (r.name === "workDetail") html = vWorkDetail(r.id);
    else if (r.name === "writing") html = vWriting();
    else if (r.name === "post") html = vPost(r.slug);
    else if (r.name === "notes") html = vNotes();
    else if (r.name === "about") html = vAbout();
    else html = vNotFound();
    app.innerHTML = html;
    document.title = titleFor(r);
    updateMeta(r, document.title);
    if (r.name === "about") {
      var pr = document.getElementById("printResume");
      if (pr) pr.addEventListener("click", function () { try { window.print(); } catch (e) {} });
    }
    document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
    document.getElementById("langLabel").textContent = lang === "en" ? "中文" : "EN";
    document.getElementById("langBtn").setAttribute("aria-label", t("lang.switch"));
    applyStaticI18n();
    markNav(r);
    var routeKey = r.name + ":" + (r.id || r.slug || "");
    if (renderedOnce && routeKey !== lastRouteKey) {
      try { app.focus({ preventScroll: true }); } catch (e) {}
    }
    lastRouteKey = routeKey;
    renderedOnce = true;
    window.scrollTo(0, 0);
    if (announcer) announcer.textContent = document.title;
    initReveal();
    wrapProseCode();
  }

  function applyStaticI18n() {
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var k = el.getAttribute("data-i18n");
      if (k) el.textContent = t(k);
    });
  }

  function markNav(r) {
    var map = { work: "work", workDetail: "work", writing: "writing", post: "writing", notes: "notes", about: "about" };
    var active = map[r.name] || "";
    document.querySelectorAll(".nav-links a[data-nav]").forEach(function (a) {
      var on = a.getAttribute("data-nav") === active;
      a.classList.toggle("on", on);
      if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    var cta = document.querySelector(".nav-tools a[data-nav='contact']");
    if (cta) {
      if (active === "about") cta.setAttribute("aria-current", "page"); else cta.removeAttribute("aria-current");
    }
  }

  var revealObserver = null;
  function initReveal() {
    var nodes = document.querySelectorAll(".reveal");
    if (!nodes.length) return;
    if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) {
      nodes.forEach(function (n) { n.classList.add("in"); });
      return;
    }
    if (revealObserver) revealObserver.disconnect();
    revealObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add("in"); revealObserver.unobserve(e.target); }
      });
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.05 });
    nodes.forEach(function (n) { revealObserver.observe(n); });
  }

  function wrapProseCode() {
    document.querySelectorAll(".prose pre").forEach(function (pre) {
      if (pre.querySelector(".copy-btn")) return;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "copy-btn";
      btn.setAttribute("data-copy", "");
      btn.textContent = t("copy");
      pre.appendChild(btn);
    });
  }

  /* ---- events ---- */
  document.addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-copy]");
    if (!btn) return;
    var host = btn.closest(".code-wrap") || btn.closest("pre");
    var code = host ? host.querySelector("code") : null;
    var text = code ? code.textContent : "";
    function done() {
      btn.textContent = t("copied");
      setTimeout(function () { btn.textContent = t("copy"); }, 1500);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, done);
    } else {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.left = "-9999px";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      done();
    }
  });

  document.getElementById("langBtn").addEventListener("click", function () {
    lang = lang === "en" ? "zh" : "en";
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    render();
  });

  window.addEventListener("hashchange", render);

  var nav = document.getElementById("nav");
  window.addEventListener("scroll", function () { nav.classList.toggle("scrolled", window.scrollY > 10); }, { passive: true });

  if (!location.hash) {
    try { history.replaceState(null, "", "#/"); } catch (e) {}
  }
  render();
})();
</script>
</body>
</html>
