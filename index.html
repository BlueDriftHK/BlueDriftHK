<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlueDriftHK · Edge Blog</title>
    <meta name="description" content="边缘计算架构师的技术博客 - Cloudflare Workers, Network Diagnostics, Open Source" />
    
    <!-- 字体与图标 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ====== 核心变量 ====== */
        :root {
            --primary: #F38020;
            --primary-dim: rgba(243, 128, 32, 0.15);
            --bg-body: #0d1117;
            --bg-card: #161b22;
            --bg-hover: #1c2333;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --border: #30363d;
            --radius: 12px;
            --max-w: 800px;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ====== 全局重置 ====== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        a { color: var(--primary); text-decoration: none; transition: all 0.2s var(--ease); }
        a:hover { color: #ffa04a; }
        ::selection { background: var(--primary); color: #fff; }

        /* ====== 布局容器 ====== */
        .container {
            max-width: var(--max-w);
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }

        /* ====== 导航栏 ====== */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 16px 0;
        }
        .nav-inner {
            max-width: var(--max-w);
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-weight: 700; font-size: 1.2rem; letter-spacing: -0.5px; }
        .logo span { color: var(--primary); }
        .nav-links { display: flex; gap: 24px; }
        .nav-links a { 
            color: var(--text-sub); 
            font-size: 0.9rem; 
            font-weight: 500;
            padding: 4px 0;
            position: relative;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--text-main); }
        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary);
            border-radius: 1px;
        }

        /* ====== 头部区域 ====== */
        .hero {
            padding: 60px 0 40px;
            text-align: center;
        }
        .hero h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }
        .hero p { color: var(--text-sub); font-size: 1.1rem; max-width: 500px; margin: 0 auto; }

        /* ====== 文章列表 ====== */
        .post-list { padding-bottom: 60px; }
        .post-item {
            display: block;
            padding: 28px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 16px;
            transition: all 0.3s var(--ease);
            cursor: pointer;
        }
        .post-item:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        .post-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            font-size: 0.8rem;
            color: var(--text-sub);
        }
        .post-tag {
            background: var(--primary-dim);
            color: var(--primary);
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.7rem;
        }
        .post-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
            line-height: 1.3;
        }
        .post-excerpt {
            color: var(--text-sub);
            font-size: 0.95rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ====== 文章详情视图 (默认隐藏) ====== */
        #article-view { display: none; padding: 40px 0 80px; }
        #article-view.visible { display: block; animation: fadeIn 0.4s var(--ease); }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-bottom: 24px;
            padding: 6px 12px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .back-btn:hover { background: var(--bg-card); color: var(--primary); }

        .article-header { margin-bottom: 32px; border-bottom: 1px solid var(--border); padding-bottom: 24px; }
        .article-header h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 16px; line-height: 1.3; }
        
        /* 文章内容排版 */
        .article-content { font-size: 1.05rem; color: #c9d1d9; }
        .article-content h2 { font-size: 1.5rem; margin: 32px 0 16px; color: var(--text-main); font-weight: 700; }
        .article-content h3 { font-size: 1.2rem; margin: 24px 0 12px; color: var(--text-main); font-weight: 600; }
        .article-content p { margin-bottom: 18px; }
        .article-content ul, .article-content ol { margin: 0 0 18px 24px; color: #c9d1d9; }
        .article-content li { margin-bottom: 6px; }
        .article-content code {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(243, 128, 32, 0.1);
            color: var(--primary);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .article-content pre {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            overflow-x: auto;
            margin-bottom: 24px;
        }
        .article-content pre code { background: none; padding: 0; color: #c9d1d9; }
        .article-content blockquote {
            border-left: 3px solid var(--primary);
            padding: 12px 20px;
            margin: 0 0 24px;
            background: var(--primary-dim);
            border-radius: 0 var(--radius) var(--radius) 0;
            color: var(--text-main);
        }
        .article-content strong { color: var(--text-main); font-weight: 600; }

        /* ====== 页脚 ====== */
        footer {
            border-top: 1px solid var(--border);
            padding: 32px 0;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.85rem;
        }

        /* ====== 动画 & 响应式 ====== */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 600px) {
            .hero h1 { font-size: 1.8rem; }
            .post-item { padding: 20px; }
            .post-title { font-size: 1.2rem; }
            .article-header h1 { font-size: 1.6rem; }
            .nav-links { gap: 16px; }
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <nav>
        <div class="nav-inner">
            <a href="#" class="logo" onclick="showHome(); return false;">BlueDrift<span>HK</span></a>
            <div class="nav-links">
                <a href="#" onclick="showHome(); return false;" class="active" id="nav-blog">Blog</a>
                <a href="https://github.com/BlueDriftHK" target="_blank">GitHub</a>
                <a href="mailto:asiacomk@gmail.com">Contact</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- 首页视图 -->
        <div id="home-view">
            <header class="hero">
                <h1>Edge Computing Notes</h1>
                <p>探索 Cloudflare Workers、网络协议与开源工具的实践记录</p>
            </header>
            <div class="post-list" id="post-list"></div>
        </div>

        <!-- 文章详情视图 -->
        <div id="article-view">
            <a href="#" class="back-btn" onclick="showHome(); return false;">
                <i class="fas fa-arrow-left"></i> 返回文章列表
            </a>
            <article>
                <div class="article-header">
                    <div class="post-meta" id="article-meta"></div>
                    <h1 id="article-title"></h1>
                </div>
                <div class="article-content" id="article-content"></div>
            </article>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 BlueDriftHK · Built with ☕ on Cloudflare Pages</p>
    </footer>

    <script>
        // ====== 博客数据 (在此处添加新文章) ======
        const posts = [
            {
                id: "websocket-retry",
                title: "WebSocket 在边缘环境下的重连策略实战",
                date: "2026-06-15",
                tag: "实时通信",
                excerpt: "深入解析如何在 Cloudflare Workers 的不稳定边缘环境中，设计一套优雅的 WebSocket 断线重连与心跳保活机制。",
                content: `
                    <p>在边缘计算场景中，WebSocket 连接面临着比传统数据中心更复杂的网络环境。本文将分享我在 <strong>CF-workers-netdiag</strong> 项目中总结的重连策略。</p>
                    
                    <h2>核心挑战</h2>
                    <p>边缘节点的连接具有以下特点：</p>
                    <ul>
                        <li>用户网络频繁切换（WiFi ↔ 4G/5G）</li>
                        <li>NAT 超时时间不可预测</li>
                        <li>Worker 实例可能被随时回收</li>
                    </ul>

                    <h2>指数退避 + 抖动算法</h2>
                    <p>我们采用了改进版的指数退避策略，避免雪崩式重连：</p>
                    <blockquote>关键原则：永远不要让所有客户端在同一时刻发起重连请求。</blockquote>
                    
                    <pre><code>function getRetryDelay(attempt) {
  const base = Math.min(1000 * Math.pow(2, attempt), 30000);
  const jitter = Math.random() * 1000;
  return base + jitter;
}</code></pre>

                    <h2>心跳保活设计</h2>
                    <p>除了重连，我们还实现了双向 Ping/Pong 机制来检测静默断开。建议心跳间隔设置为 <strong>25秒</strong>，这能兼容大多数运营商的 NAT 超时策略。</p>
                `
            },
            {
                id: "cold-start-optimization",
                title: "Cloudflare Workers 冷启动优化：从 80ms 到 12ms",
                date: "2026-05-28",
                tag: "性能优化",
                excerpt: "通过代码分割、延迟初始化和 V8 快照技术，将 Worker 冷启动时间降低 85% 的完整实践指南。",
                content: `
                    <p>冷启动是 Serverless 架构中最常被诟病的问题之一。但在 Cloudflare Workers 上，通过合理的代码组织，我们可以将其控制在极低水平。</p>

                    <h2>瓶颈分析</h2>
                    <p>使用 <code>wrangler dev --inspect</code> 进行性能剖析后，我们发现主要耗时集中在：</p>
                    <ul>
                        <li>顶层 import 的大型库初始化（占 60%）</li>
                        <li>KV/D1 绑定的首次握手（占 25%）</li>
                        <li>全局变量声明与正则编译（占 15%）</li>
                    </ul>

                    <h2>优化三板斧</h2>
                    <h3>1. 动态 Import</h3>
                    <p>将非关键路径的依赖改为按需加载：</p>
                    <pre><code>// ❌ Before
import { heavyParser } from './parser';

// ✅ After  
const { heavyParser } = await import('./parser');</code></pre>

                    <h3>2. 连接预热</h3>
                    <p>利用 <code>c.waitUntil()</code> 在响应返回后继续执行预热逻辑，让下一次请求享受热连接。</p>

                    <h2>成果</h2>
                    <p>经过优化，P99 冷启动时间从 <strong>80ms 降至 12ms</strong>，用户体验几乎无感知。</p>
                `
            },
            {
                id: "hls-adaptive-bitrate",
                title: "HLS.js 在低带宽场景下的自适应码率调优",
                date: "2026-05-10",
                tag: "流媒体",
                excerpt: "针对东南亚及南美等弱网环境，调整 HLS.js 的 ABR 控制器参数，实现更平滑的视频播放体验。",
                content: `
                    <p>在网络诊断工具中集成视频流测试时，我们发现默认的 HLS.js 配置在弱网下频繁卡顿。本文记录了我们的调优过程。</p>

                    <h2>问题定位</h2>
                    <p>默认 ABR 算法过于激进，在带宽波动时会立即切换到最低画质，导致用户体验断崖式下降。</p>

                    <h2>自定义 ABR 配置</h2>
                    <pre><code>const hls = new Hls({
  abrEwmaFastLive: 3.0,
  abrEwmaSlowLive: 9.0,
  abrBandWidthUpFactor: 0.7,
  abrMaxWithRealBitrate: true,
  maxStarvationDelay: 4
});</code></pre>

                    <blockquote>核心思路：降低快速估算权重，增加慢速估算权重，让算法对带宽波动更加"迟钝"，避免频繁切档。</blockquote>

                    <p>调整后，弱网环境下的画质切换次数减少了 <strong>70%</strong>，播放中断率下降了 <strong>45%</strong>。</p>
                `
            }
        ];

        // ====== 渲染逻辑 ======
        const postListEl = document.getElementById('post-list');
        const homeView = document.getElementById('home-view');
        const articleView = document.getElementById('article-view');
        const navBlog = document.getElementById('nav-blog');

        // 渲染文章列表
        function renderPosts() {
            postListEl.innerHTML = posts.map(post => `
                <div class="post-item" onclick="showPost('${post.id}')">
                    <div class="post-meta">
                        <span class="post-tag">${post.tag}</span>
                        <span><i class="far fa-calendar-alt"></i> ${post.date}</span>
                    </div>
                    <div class="post-title">${post.title}</div>
                    <div class="post-excerpt">${post.excerpt}</div>
                </div>
            `).join('');
        }

        // 显示文章详情
        window.showPost = function(id) {
            const post = posts.find(p => p.id === id);
            if (!post) return;

            document.getElementById('article-title').textContent = post.title;
            document.getElementById('article-meta').innerHTML = `
                <span class="post-tag">${post.tag}</span>
                <span><i class="far fa-calendar-alt"></i> ${post.date}</span>
                <span><i class="far fa-clock"></i> ${Math.ceil(post.content.length / 500)} min read</span>
            `;
            document.getElementById('article-content').innerHTML = post.content;

            homeView.style.display = 'none';
            articleView.classList.add('visible');
            navBlog.classList.remove('active');
            window.scrollTo({ top: 0 });
            
            // 更新 URL (不刷新)
            history.pushState({ postId: id }, '', `#${id}`);
        };

        // 返回首页
        window.showHome = function() {
            articleView.classList.remove('visible');
            homeView.style.display = 'block';
            navBlog.classList.add('active');
            window.scrollTo({ top: 0 });
            history.pushState(null, '', window.location.pathname);
        };

        // 处理浏览器前进/后退
        window.addEventListener('popstate', (e) => {
            if (e.state && e.state.postId) {
                showPost(e.state.postId);
            } else {
                showHome();
            }
        });

        // 处理直接访问带 hash 的 URL
        window.addEventListener('DOMContentLoaded', () => {
            renderPosts();
            const hash = window.location.hash.slice(1);
            if (hash && posts.find(p => p.id === hash)) {
                showPost(hash);
            }
        });
    </script>
</body>
</html>
