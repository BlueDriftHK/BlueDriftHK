<style>
:root{
  --bg:#050506; --bg-soft:#0b0b0e;
  --text:#f5f5f7; --text-2:#a1a1a6; --text-3:#6e6e73;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --card:rgba(255,255,255,.045); --card-2:rgba(255,255,255,.075);
  --g1:#0a84ff; --g2:#64d2ff; --g3:#bf5af2; --g4:#ff375f;
  --green:#30d158; --blue:#2997ff; --orange:#ff9f0a;
  --radius:24px; --radius-sm:14px; --radius-pill:999px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --max:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.65;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:clip}
body::before{content:"";position:fixed;inset:-10% -10% auto;height:900px;z-index:0;pointer-events:none;
  background:
    radial-gradient(720px 420px at 14% 0%, rgba(10,132,255,.16), transparent 62%),
    radial-gradient(700px 460px at 76% 4%, rgba(191,90,242,.13), transparent 60%),
    radial-gradient(520px 340px at 52% 18%, rgba(100,210,255,.07), transparent 70%);}
a{color:inherit;text-decoration:none}
img,svg{display:block}
.wrap{position:relative;z-index:1;max-width:var(--max);margin:0 auto;padding:0 26px}
::selection{background:rgba(10,132,255,.35)}
:focus-visible{outline:2px solid var(--g2);outline-offset:3px;border-radius:6px}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:50;border-bottom:1px solid transparent;
  background:rgba(5,5,6,.62);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);
  transition:border-color .3s var(--ease)}
.nav.scrolled{border-bottom-color:var(--line)}
.nav-in{max-width:var(--max);margin:0 auto;padding:0 26px;height:66px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.mark{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--g1),var(--g3));box-shadow:0 4px 16px rgba(10,132,255,.35)}
.brand small{font-family:var(--mono);font-size:10px;color:var(--text-3);letter-spacing:.04em;font-weight:400;margin-left:2px}
.nav-links{display:flex;gap:2px;margin-left:auto}
.nav-links a{font-size:13.5px;color:var(--text-2);padding:8px 13px;border-radius:var(--radius-pill);transition:.2s;white-space:nowrap}
.nav-links a:hover{color:var(--text);background:rgba(255,255,255,.06)}
.nav-links a.on{color:var(--text);background:rgba(255,255,255,.09);font-weight:550}
.nav-tools{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius-pill);
  font-size:14.5px;font-weight:600;padding:11px 22px;transition:transform .2s var(--ease),box-shadow .3s,background .2s;white-space:nowrap;cursor:pointer;border:0;font-family:inherit}
.btn-white{background:#fff;color:#0b0b0e;box-shadow:0 8px 30px rgba(255,255,255,.12)}
.btn-white:hover{transform:translateY(-1.5px);box-shadow:0 14px 40px rgba(255,255,255,.2)}
.btn-ghost{color:var(--text);border:1px solid var(--line-2);background:rgba(255,255,255,.04)}
.btn-ghost:hover{background:rgba(255,255,255,.09);transform:translateY(-1.5px)}
.btn-sm{padding:9px 17px;font-size:13.5px}
.btn-xs{padding:7px 13px;font-size:12px;font-weight:600}
#langBtn{min-width:46px;font-family:var(--mono);letter-spacing:.04em}

/* ---------- hero ---------- */
.hero{padding:86px 0 30px}
.hero-grid{display:grid;grid-template-columns:1.06fr .94fr;gap:56px;align-items:center;min-height:560px}
.hero-grid>*{min-width:0}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);
  border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:var(--radius-pill);padding:7px 14px}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
h1{font-size:clamp(40px,5vw,64px);line-height:1.06;letter-spacing:-.035em;font-weight:800;margin:22px 0 20px}
.grad{background:linear-gradient(100deg,var(--g1) 0%,var(--g2) 32%,var(--g3) 66%,var(--g4) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:16.5px;line-height:1.85;color:var(--text-2);max-width:52ch}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin:30px 0 24px}
.meta-row{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--text-3)}
.meta-row span{display:inline-flex;align-items:center;gap:7px}
.meta-row span::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--text-3);opacity:.7}

/* mock window */
.mock{position:relative;min-width:0}
.mock-glow{position:absolute;left:2%;right:2%;bottom:2%;height:62%;z-index:0;pointer-events:none;
  background:radial-gradient(60% 70% at 55% 60%, rgba(10,132,255,.22), transparent 70%);filter:blur(18px)}
.window{position:relative;z-index:1;min-width:0;border:1px solid var(--line);border-radius:20px;overflow:hidden;
  background:linear-gradient(180deg,rgba(28,28,34,.92),rgba(12,12,16,.96));
  box-shadow:0 40px 100px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.07)}
.win-bar{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%}
.dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.win-title{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-left:6px;letter-spacing:.04em}
.win-body{padding:20px}
.profile{display:flex;align-items:center;gap:13px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;
  background:linear-gradient(135deg,#0a84ff,#bf5af2);box-shadow:0 8px 22px rgba(10,132,255,.35)}
.p-name{font-size:15px;font-weight:650;letter-spacing:-.01em}
.p-hand{font-family:var(--mono);font-size:11.5px;color:var(--text-3)}
.status{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--green);
  border:1px solid rgba(48,209,88,.28);background:rgba(48,209,88,.08);border-radius:var(--radius-pill);padding:4px 10px;white-space:nowrap}
.status i{width:5px;height:5px;border-radius:50%;background:var(--green)}
.mock-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:16px 0}
.mock-stats div{background:rgba(255,255,255,.025);padding:12px 14px}
.mock-stats b{display:block;font-size:19px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mock-stats small{font-size:10.5px;color:var(--text-3);letter-spacing:.02em}
.mock-list{font-size:12.5px;color:var(--text-2)}
.mock-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid rgba(255,255,255,.05);min-width:0;overflow:hidden}
.mock-row:last-child{border-bottom:none}
.mock-row time{font-family:var(--mono);font-size:10.5px;color:var(--text-3);flex:0 0 62px}
.mock-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mock-row em{margin-left:auto;font-style:normal;font-size:11px;color:var(--text-3);white-space:nowrap}
.float{position:absolute;z-index:2;display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:12px;
  border:1px solid var(--line-2);background:rgba(16,16,20,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 16px 40px rgba(0,0,0,.45);font-size:11.5px;color:var(--text-2)}
.float b{display:block;font-size:12px;color:var(--text);font-weight:600}
.float .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(10,132,255,.16);color:var(--blue);flex:0 0 auto}
.float.f1{top:-14px;right:18px;animation:floaty 7s var(--ease) infinite}
.float.f2{bottom:-30px;left:20px;animation:floaty 8s var(--ease) infinite reverse}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.scroll-hint{margin:52px 0 12px;display:flex;flex-direction:column;align-items:center;gap:10px;
  font-family:var(--mono);font-size:10px;letter-spacing:.32em;color:var(--text-3)}
.scroll-hint i{width:1px;height:30px;background:linear-gradient(180deg,var(--text-3),transparent)}

/* ---------- sections ---------- */
.section{padding:92px 0}
.kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-3);display:flex;align-items:center;gap:12px}
.kicker::before{content:"";width:26px;height:1px;background:var(--text-3);opacity:.6}
h2{font-size:clamp(30px,3.4vw,42px);line-height:1.12;letter-spacing:-.03em;font-weight:750;margin:16px 0 14px}
.sec-lead{font-size:15.5px;color:var(--text-2);max-width:64ch;line-height:1.85}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:34px;flex-wrap:wrap}
.sec-head .more{font-size:13.5px;color:var(--text-2);white-space:nowrap;padding:8px 0;transition:.2s}
.sec-head .more:hover{color:var(--text)}
.page-hero{padding:72px 0 10px}
.page-hero h1{font-size:clamp(34px,4.4vw,56px);margin:16px 0 18px}
.page-hero .lead{max-width:62ch}
.page-hero .count{font-family:var(--mono);font-size:11.5px;color:var(--text-3);letter-spacing:.05em;margin-top:20px}

/* ---------- work cards ---------- */
.work-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.work{position:relative;display:block;border:1px solid var(--line);border-radius:var(--radius);padding:28px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  transition:transform .4s var(--ease),border-color .4s,box-shadow .4s}
.work::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;
  background:radial-gradient(420px 260px at 20% 0%, rgba(10,132,255,.14), transparent 65%)}
.work:hover{transform:translateY(-4px);border-color:var(--line-2);box-shadow:0 30px 70px rgba(0,0,0,.4)}
.work:hover::after{opacity:1}
.work-top{display:flex;align-items:center;gap:13px;margin-bottom:20px;flex-wrap:wrap}
.tile{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;color:#fff}
.work-top h3{font-size:19px;letter-spacing:-.015em;font-weight:700}
.work-top .sub{font-size:12px;color:var(--text-3);margin-top:1px}
.chip{font-family:var(--mono);font-size:10.5px;color:var(--text-2);border:1px solid var(--line);border-radius:var(--radius-pill);padding:3px 9px;white-space:nowrap}
.work-top .chip{margin-left:auto}
.work p{font-size:14px;line-height:1.8;color:var(--text-2);min-height:76px}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:20px 0 18px}
.specs div{background:rgba(255,255,255,.025);padding:11px 13px}
.specs b{display:block;font-size:14.5px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.specs small{font-size:10.5px;color:var(--text-3)}
.tags{display:flex;flex-wrap:wrap;gap:7px}
.tags span{font-size:11.5px;color:var(--text-2);background:rgba(255,255,255,.06);border-radius:7px;padding:4px 9px}
.work-cta{display:flex;align-items:center;justify-content:space-between;margin-top:16px;border-top:1px solid var(--line);padding-top:14px;font-size:13px;font-weight:600;color:var(--text)}
.work-cta .arrow{transition:transform .25s var(--ease);color:var(--text-3)}
.work:hover .work-cta .arrow{transform:translateX(5px);color:var(--g2)}

/* ---------- post rows ---------- */
.posts{display:grid;gap:2px}
.post{display:grid;grid-template-columns:104px 1fr auto;gap:22px;align-items:baseline;padding:22px 8px;border-top:1px solid var(--line);transition:background .25s}
.post:last-child{border-bottom:1px solid var(--line)}
.post:hover{background:rgba(255,255,255,.025)}
.post time{font-family:var(--mono);font-size:12px;color:var(--text-3)}
.post h3{font-size:17px;letter-spacing:-.01em;font-weight:620;transition:color .2s;line-height:1.45}
.post:hover h3{color:var(--blue)}
.post .sum{font-size:13px;color:var(--text-3);margin-top:5px;line-height:1.7;max-width:64ch}
.post .cat{font-size:11.5px;color:var(--text-3);white-space:nowrap}

/* ---------- notes ---------- */
.notes{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.note{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--card);transition:.3s var(--ease);display:block}
.note:hover{border-color:var(--line-2);background:var(--card-2);transform:translateY(-3px)}
.note h4 a:hover,.note-full h3 a:hover{color:var(--blue)}
.note .tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--blue);text-transform:uppercase}
.note h4{font-size:14px;font-weight:600;margin:9px 0 8px;line-height:1.5;letter-spacing:-.01em}
.note p{font-size:12px;color:var(--text-3);line-height:1.7}
.note .upd{font-family:var(--mono);font-size:10px;color:var(--text-3);margin-top:12px;display:flex;justify-content:space-between;gap:8px}
.note .upd a{color:var(--text-3)}
.note .upd a:hover{color:var(--text)}

/* ---------- about ---------- */
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:start}
.about-main p{font-size:15px;color:var(--text-2);line-height:1.9;max-width:56ch;margin-bottom:14px}
.skills{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 26px}
.skills span{font-size:12.5px;color:var(--text-2);border:1px solid var(--line);border-radius:var(--radius-pill);padding:6px 13px;background:rgba(255,255,255,.03)}
.tl{display:grid;gap:0}
.tl-item{display:grid;grid-template-columns:86px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.tl-item time{font-family:var(--mono);font-size:12px;color:var(--text-3)}
.tl-item p{font-size:13.5px;color:var(--text-2);line-height:1.7}
.card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));padding:24px}
.card h4{font-size:14px;font-weight:600;margin-bottom:14px}
.kv{display:grid;gap:11px;font-size:13px}
.kv div{display:grid;grid-template-columns:74px 1fr;gap:12px;align-items:baseline}
.kv .k{color:var(--text-3);font-size:12px}
.kv .v{color:var(--text-2)}
.kv .v a{text-decoration:underline;text-decoration-color:rgba(41,151,255,.35);text-underline-offset:3px}
.kv .v a:hover{color:var(--blue)}
.card-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}

/* ---------- cta / footer ---------- */
.cta{padding:96px 0 72px;text-align:center;border-top:1px solid var(--line);position:relative}
.cta::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(520px 300px at 50% 30%, rgba(90,92,241,.16), transparent 70%)}
.cta h2{font-size:clamp(30px,4vw,48px);max-width:18ch;margin:0 auto 18px}
.cta p{color:var(--text-2);font-size:15px;max-width:52ch;margin:0 auto 28px}
.cta .hero-cta{justify-content:center;margin:0}
.footer{border-top:1px solid var(--line);padding:34px 0 40px;font-size:12.5px;color:var(--text-3)}
.footer-in{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.footer a:hover{color:var(--text-2)}

/* ---------- work detail ---------- */
.detail-head{padding:46px 0 10px}
.back{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--text-3);margin-bottom:26px;transition:.2s}
.back:hover{color:var(--text)}
.detail-title{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}
.detail-title .tile{width:60px;height:60px;border-radius:18px}
.detail-title h1{font-size:clamp(30px,4vw,50px);margin:2px 0 6px;line-height:1.05}
.detail-title .sub{font-size:13.5px;color:var(--text-3)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chips .chip{padding:5px 11px;font-size:11px}
.chips a.chip{transition:.2s}
.chips a.chip:hover{color:var(--text);border-color:var(--line-2);background:rgba(255,255,255,.06)}
.detail-lead{font-size:16px;color:var(--text-2);line-height:1.85;max-width:70ch;margin:24px 0 30px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.kpis div{background:rgba(255,255,255,.03);padding:16px 18px}
.kpis b{display:block;font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpis small{font-size:11px;color:var(--text-3)}
.detail-section{padding:56px 0 0}
.detail-section h2{font-size:clamp(22px,2.4vw,28px);margin:10px 0 18px}
.features{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.feat{border:1px solid var(--line);border-radius:16px;padding:20px;background:var(--card);transition:.3s var(--ease)}
.feat:hover{border-color:var(--line-2);background:var(--card-2)}
.feat .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(10,132,255,.14);color:var(--blue);margin-bottom:13px}
.feat h4{font-size:14.5px;font-weight:650;margin-bottom:7px;letter-spacing:-.01em}
.feat p{font-size:13px;color:var(--text-3);line-height:1.75}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.table-card{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:20px}
.table-card h4{font-size:13px;font-weight:600;margin-bottom:12px;color:var(--text)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:400;padding:0 10px 8px 0;border-bottom:1px solid var(--line-2)}
.tbl td{padding:9px 10px 9px 0;border-bottom:1px solid rgba(255,255,255,.05);color:var(--text-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl code{font-family:var(--mono);font-size:11.5px;color:var(--text);background:rgba(10,132,255,.12);border-radius:5px;padding:1px 6px}
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.badge.req{background:rgba(10,132,255,.16);color:var(--blue)}
.badge.opt{background:rgba(255,255,255,.07);color:var(--text-3)}
.bounds{list-style:none;display:grid;gap:10px}
.bounds li{position:relative;padding-left:26px;font-size:13.5px;color:var(--text-2);line-height:1.8}
.bounds li::before{content:"!";position:absolute;left:0;top:2px;width:16px;height:16px;border-radius:5px;background:rgba(255,159,10,.14);color:var(--orange);font-size:10px;font-weight:700;display:grid;place-items:center}
.code-wrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0a0a0d;margin-top:6px}
.code-bar{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.025)}
.code-bar span{font-family:var(--mono);font-size:11px;color:var(--text-3)}
.copy-btn{background:none;border:0;color:var(--text-3);font-family:inherit;font-size:12px;cursor:pointer;padding:3px 8px;border-radius:6px}
.copy-btn:hover{color:var(--text);background:rgba(255,255,255,.07)}
.code-wrap pre{margin:0;padding:16px 18px;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.8;color:#d6d6dc}
.callout{border-left:3px solid var(--g3);background:rgba(191,90,242,.08);border-radius:0 10px 10px 0;padding:13px 16px;font-size:13.5px;color:var(--text-2);line-height:1.8;margin-top:16px}

/* ---------- prose (articles) ---------- */
.article{max-width:780px;margin:0 auto;padding:52px 0 8px}
.article-head{padding-bottom:24px;border-bottom:1px solid var(--line-2);margin-bottom:28px}
.article-head .kicker{margin-bottom:16px}
.article-head h1{font-size:clamp(28px,4vw,42px);line-height:1.2;letter-spacing:-.025em;margin:0 0 16px}
.article-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:11px;color:var(--text-3);letter-spacing:.03em}
.article-meta span::before{content:"·";margin-right:7px;color:var(--text-3)}
.article-meta span:first-child::before{content:"";margin:0}
.article-lead{font-size:16px;color:var(--text-2);line-height:1.85;margin:18px 0 0}
.article-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
.article-tags span{font-size:11.5px;color:var(--text-2);background:rgba(255,255,255,.06);border-radius:7px;padding:4px 9px}
.prose{font-size:16px;line-height:1.9;color:var(--text-2)}
.prose>*+*{margin-top:16px}
.prose h2{font-size:24px;line-height:1.3;letter-spacing:-.02em;color:var(--text);margin-top:40px;font-weight:700}
.prose h3{font-size:18px;line-height:1.45;color:var(--text);margin-top:30px;font-weight:650}
.prose p{color:var(--text-2)}
.prose strong{color:var(--text);font-weight:650}
.prose a{color:var(--blue);text-decoration:underline;text-decoration-color:rgba(41,151,255,.4);text-underline-offset:3px}
.prose ul,.prose ol{padding-left:24px;display:grid;gap:7px}
.prose li{color:var(--text-2)}
.prose li::marker{color:var(--blue)}
.prose blockquote{border-left:3px solid var(--g3);background:rgba(191,90,242,.09);border-radius:0 10px 10px 0;padding:14px 18px;color:var(--text)}
.prose code{font-family:var(--mono);font-size:.86em;background:rgba(10,132,255,.13);color:var(--text);padding:1.5px 6px;border-radius:6px}
.prose pre{background:#0a0a0d;border:1px solid var(--line);border-radius:12px;padding:16px 18px;overflow:auto;position:relative}
.prose pre code{background:none;padding:0;font-size:12.8px;line-height:1.8;display:block;color:#d6d6dc}
.prose table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.prose th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:0 12px 8px 0;border-bottom:1px solid var(--line-2);font-weight:400}
.prose td{padding:10px 12px 10px 0;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top}
.prose hr{border:0;border-top:1px solid var(--line);margin:32px 0}
.tok-kw{color:#e0a6ff;font-weight:600}
.tok-str{color:#7ee2a8}
.tok-num{color:#ffb86b}
.tok-com{color:var(--text-3);font-style:italic}
.article-nav{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:46px}
.nav-card{border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:5px;background:var(--card);transition:.25s var(--ease)}
.nav-card:hover{border-color:var(--line-2);background:var(--card-2);transform:translateY(-2px)}
.nav-card span{font-family:var(--mono);font-size:10.5px;color:var(--text-3);letter-spacing:.04em}
.nav-card b{font-size:14px;line-height:1.5;font-weight:600}
.nav-card.right{text-align:right}
.article-foot{margin-top:30px;padding-top:22px;border-top:1px solid var(--line-2)}
.notice{border:1px solid rgba(255,159,10,.28);background:rgba(255,159,10,.08);border-radius:12px;padding:12px 16px;font-size:13px;color:var(--orange);margin:22px 0 0}
.prose pre .copy-btn{position:absolute;top:8px;right:10px;opacity:0;transition:opacity .15s}
.prose pre:hover .copy-btn,.prose pre .copy-btn:focus-visible{opacity:1}

/* ---------- notes page ---------- */
.notes-page{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-top:18px}
.note-full{border:1px solid var(--line);border-radius:18px;padding:22px;background:var(--card);display:grid;gap:9px;transition:.25s var(--ease)}
.note-full:hover{border-color:var(--line-2);background:var(--card-2)}
.note-full .tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--blue);text-transform:uppercase}
.note-full h3{font-size:16px;font-weight:650;letter-spacing:-.01em;line-height:1.45}
.note-full p{font-size:13.5px;color:var(--text-2);line-height:1.8}
.note-full .foot{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-top:4px}
.note-full .foot time{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.note-full .foot a{font-size:11.5px;color:var(--text-3)}
.note-full .foot a:hover{color:var(--blue)}
.note-full .upd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:4px}
.note-full .upd time{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.note-full .upd a{font-size:11.5px;color:var(--text-3)}
.note-full .upd a:hover{color:var(--blue)}

/* ---------- a11y / print ---------- */
.skip{position:absolute;left:-9999px;top:12px;z-index:100;background:#fff;color:#0b0b0e;font-size:13px;
  font-weight:600;padding:9px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.skip:focus{left:18px}
#app:focus{outline:none}

@media print{
  @page{margin:16mm}
  body{background:#fff !important;color:#111 !important}
  body::before,.nav,.footer,.cta,.skip,.float,.mock-glow,.scroll-hint,.hero-cta,.back,.page-hero .count{display:none !important}
  .wrap{max-width:100%;padding:0}
  .reveal{opacity:1 !important;transform:none !important}
  h1,h2,h3,h4,.grad,.kv .v,.tl-item p,.about-main p,.lead{color:#111 !important;-webkit-text-fill-color:#111 !important;background:none !important}
  h1{font-size:26px}
  h2{font-size:18px;margin:18px 0 8px}
  .page-hero{padding:0 0 14px}
  .lead,.about-main p{font-size:12px;line-height:1.6;max-width:none}
  .about{grid-template-columns:1.15fr .85fr;gap:16px}
  .about-main p{margin-bottom:8px}
  .card,.table-card,.feat,.note,.note-full,.work,.note-full{border:1px solid #ddd !important;background:#fff !important;box-shadow:none !important;break-inside:avoid}
  .card,.table-card{padding:10px 12px}
  .kv{gap:5px;font-size:11px}
  .kv div{grid-template-columns:64px 1fr}
  .tl-item{padding:6px 0;break-inside:avoid}
  .tl-item p{font-size:11px}
  .skills{display:none !important}
  .kicker{color:#666 !important}
  .kicker::before{background:#666 !important}
  a{color:#111 !important;text-decoration:none !important}
  .about .contact{display:none !important}
}

/* ---------- misc ---------- */
.reveal{opacity:0;transform:translateY(16px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.reveal.in{opacity:1;transform:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}.float{animation:none}html{scroll-behavior:auto}}

@media (max-width:1020px){
  .hero-grid{grid-template-columns:1fr;gap:54px;min-height:0;padding-top:8px}
  .hero-right{max-width:620px}
  .float.f1{right:8px}.float.f2{left:6px}
  .work-grid,.about,.features,.two-col,.notes-page{grid-template-columns:1fr}
  .notes{grid-template-columns:repeat(2,1fr)}
  .article-nav{grid-template-columns:1fr}
  .nav-card.right{text-align:left}
}
@media (max-width:720px){
  .wrap,.nav-in{padding:0 18px}
  .nav-in{height:60px;gap:10px}
  .brand small{display:none}
  .nav-links{margin-left:0;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;justify-content:flex-start}
  .nav-links::-webkit-scrollbar{display:none}
  .nav-links a{padding:7px 10px;font-size:12.5px}
  .nav-tools{gap:6px}
  .hero{padding:54px 0 10px}
  h1{font-size:clamp(34px,9vw,46px)}
  .section{padding:64px 0}
  .notes{grid-template-columns:1fr 1fr}
  .post{grid-template-columns:1fr;gap:6px}
  .post time{order:-1}
  .specs{grid-template-columns:repeat(3,1fr)}
  .kpis{grid-template-columns:1fr 1fr}
  .float{display:none}
  .page-hero{padding:48px 0 6px}
  .article{padding:34px 0 8px}
  .prose{font-size:15px}
  .tl-item{grid-template-columns:72px 1fr;gap:12px}
}
@media (max-width:460px){
  .notes{grid-template-columns:1fr}
  .detail-title h1{font-size:clamp(26px,8vw,34px)}
}
</style>
</head>
