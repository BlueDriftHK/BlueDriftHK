<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跳转中… / NETSIGHT·PRO</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=./index.html">
<style>
  :root {
    --bg: #0a0a0a;
    --bg-grid: rgba(255, 255, 255, 0.045);
    --panel: #111111;
    --line: #2a2a2a;
    --line-strong: #3a3a3a;
    --text: #d6d6d6;
    --text-dim: #8a8a8a;
    --text-faint: #5a5a5a;
    --accent: #c9c9c9;
    --warn: #b08d3e;
    --grid-size: 24px;
    --radius: 0px;
    --font-mono: "Cascadia Mono", "JetBrains Mono", Consolas, "Courier New", monospace;
    --font-sans: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; border-radius: var(--radius); }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: var(--grid-size) var(--grid-size);
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 40px 56px;
    text-align: center;
    max-width: 480px;
  }
  .panel .code { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.2em; color: var(--warn); }
  .panel h1 { font-family: var(--font-mono); font-size: 18px; margin: 16px 0 8px; color: var(--text); letter-spacing: 0.08em; }
  .panel p { font-size: 13px; color: var(--text-dim); }
  .panel .bar {
    width: 160px; height: 2px; margin: 20px auto 0;
    background: var(--line);
    overflow: hidden;
  }
  .panel .bar i {
    display: block; width: 40%; height: 100%;
    background: var(--accent);
    animation: slide 0.9s linear infinite;
  }
  @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(420%); } }
</style>
</head>
<body>
<div class="panel">
  <div class="code">[ POST ARCHIVE MERGED ]</div>
  <h1>REDIRECTING…</h1>
  <p>博客已合并为单文件，正在跳转到 <code>index.html</code>。</p>
  <div class="bar"><i></i></div>
</div>
<script>
  // 跳转版：保留旧 post.html?id=xxx&key= 链接的语义，转换到 index.html?id=xxx#key=
  (function () {
    var params = new URLSearchParams(window.location.search);
    var id = params.get("id");
    var key = params.get("key");
    var target = "./index.html";
    if (id) {
      target += "?id=" + encodeURIComponent(id);
      if (key && key !== "__KEY__") target += "#key=" + encodeURIComponent(key);
    }
    window.location.replace(target);
  })();
</script>
</body>
</html>
